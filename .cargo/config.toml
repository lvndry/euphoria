# macOS needs an app bundle to show the desktop name in the Dock and menus.
[target.'cfg(target_os = "macos")']
runner = "scripts/run-macos.py"

[alias]
# `cargo app` runs the desktop app with the fast profile; `cargo cli -- analyze …` the command line tool.
app = "run --profile fast -p euphoria-desktop"
cli = "run --profile fast -p euphoria-cli --"
