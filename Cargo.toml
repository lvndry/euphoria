[workspace]
resolver = "3"
members = [
  "crates/euphoria-core",
  "crates/euphoria-cli",
  "crates/euphoria-bench",
  "crates/euphoria-desktop",
]

[workspace.package]
authors = ["The Euphoria contributors"]
homepage = "https://github.com/lvndry/euphoria"
repository = "https://github.com/lvndry/euphoria"
categories = ["multimedia::audio"]
keywords = ["dj", "music", "key-detection", "bpm", "camelot"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
euphoria-core = { version = "0.1.0", path = "crates/euphoria-core" }
anyhow = "1.0.100"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
console = { version = "0.16.6", default-features = false, features = [
  "std",
  "unicode-width",
  "ansi-parsing",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
rayon = "1.11.0"
roxmltree = "0.21.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
ebur128 = "0.1.11"
rustfft = "6.4.1"
stratum-dsp = "1.0.0"
symphonia = { version = "0.6.1", default-features = false }
thiserror = "2.0.21"
cc = "1.11.1"
gpui = { package = "gpui-kit", version = "=0.9.1" }
lofty = "0.25.5"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSImage",
  "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
pkg-config = "0.3.34"
signalsmith-stretch = "=0.1.3"
rodio = { version = "=0.23.0", default-features = false, features = ["playback"] }
png = "0.18.1"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
