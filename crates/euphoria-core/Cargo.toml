[package]
name = "euphoria-core"
version = "0.1.0"
description = "Key and tempo detection for music files, the library behind Euphoria"
readme = "../../README.md"
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
ebur128.workspace = true
flacenc = { workspace = true, optional = true }
hound.workspace = true
# Reads the cover art of a track, and in the tests writes it to check against.
lofty.workspace = true
matrixmultiply = { workspace = true, optional = true }
rayon.workspace = true
flate2.workspace = true
rusqlite.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
stratum-dsp.workspace = true
symphonia = { workspace = true, features = [
  "mp3",
  "aac",
  "alac",
  "isomp4",
  "aiff",
  "flac",
  "wav",
  "pcm",
  "ogg",
  "vorbis",
  "id3v1",
  "id3v2",
] }
roxmltree.workspace = true
thiserror.workspace = true
walkdir.workspace = true
ort = { workspace = true, optional = true }
# Writes rendered mixes as MP3 with LAME, compiled from the source vendored
# in mp3lame-sys. LGPL: see deny.toml and licenses/.
mp3lame-encoder = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-core-audio.workspace = true
objc2-core-audio-types.workspace = true
objc2-foundation = { workspace = true, features = [
  "NSObject",
  "NSUUID",
  "NSString",
  "NSArray",
  "NSDictionary",
  "NSValue",
] }

[dev-dependencies]
proptest.workspace = true
roxmltree.workspace = true
tempfile.workspace = true

[features]
default = ["pitch-shift", "drone", "mp3"]
# Key detection with drone-v2, a small neural network that ships inside the
# library and runs on the CPU in plain Rust.
drone = ["dep:matrixmultiply"]
# Changing the key of a track with Signalsmith Stretch, a C++ library vendored
# in vendor/ and compiled with the crate: it needs a C++ compiler but not
# libclang.
pitch-shift = ["dep:cc", "dep:flacenc"]
# Writing rendered mixes as MP3 with LAME, a C library vendored in the
# mp3lame-sys crate and compiled with the crate: it needs a C compiler, no
# system library.
mp3 = ["pitch-shift", "dep:mp3lame-encoder"]
# Separating tracks into stems with Demucs htdemucs through ONNX Runtime,
# which is linked statically and adds tens of megabytes to the binary.
# Exporting stems, which can shift their key, also needs `pitch-shift`; a
# program that only separates can leave Signalsmith Stretch out, so it can
# link another copy of it without the two clashing.
stems = ["dep:ort", "dep:rubato", "dep:sha2", "dep:ureq", "dep:tempfile"]

[[example]]
name = "drone_features"
required-features = ["drone"]

[build-dependencies]
cc = { workspace = true, optional = true }

[lints]
workspace = true
