[package]
name = "euphoria-core"
version = "0.1.0"
description = "Key and tempo detection for music files, the library behind Euphoria"
readme = "../../README.md"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rayon.workspace = true
stratum-dsp.workspace = true
symphonia = { workspace = true, features = ["mp3", "aac", "isomp4", "aiff", "flac", "wav", "pcm"] }
thiserror.workspace = true
walkdir.workspace = true

[features]
default = ["libkeyfinder"]
# Key detection through libkeyfinder, a C++ library found with pkg-config.
libkeyfinder = ["dep:cc", "dep:pkg-config"]

[build-dependencies]
cc = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }

[lints]
workspace = true
