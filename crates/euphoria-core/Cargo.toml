[package]
name = "euphoria-core"
version = "2026.11.5"
description = "Key and tempo detection for music files, the library behind Euphoria"
readme = "../../README.md"
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
ebur128.workspace = true
flacenc.workspace = true
hound.workspace = true
# Reads the cover art of a track, and in the tests writes it to check against.
lofty.workspace = true
matrixmultiply = { workspace = true, optional = true }
rayon.workspace = true
flate2.workspace = true
rusqlite.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
stratum-dsp.workspace = true
symphonia = { workspace = true, features = [
  "mp3",
  "aac",
  "alac",
  "isomp4",
  "aiff",
  "flac",
  "wav",
  "pcm",
  "ogg",
  "vorbis",
  "id3v1",
  "id3v2",
] }
roxmltree.workspace = true
thiserror.workspace = true
walkdir.workspace = true
ort = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
roxmltree.workspace = true
tempfile.workspace = true

[features]
default = ["libkeyfinder", "pitch-shift", "drone"]
# Key detection with drone-v2, a small neural network that ships inside the
# library and runs on the CPU in plain Rust.
drone = ["dep:matrixmultiply"]
# Key detection through libkeyfinder, a C++ library found with pkg-config.
libkeyfinder = ["dep:cc", "dep:pkg-config"]
# Changing the key of a track with Signalsmith Stretch, a C++ library vendored
# in vendor/ and compiled with the crate: it needs a C++ compiler but not
# libclang.
pitch-shift = ["dep:cc"]
# Separating tracks into stems with Demucs htdemucs through ONNX Runtime,
# which is linked statically and adds tens of megabytes to the binary.
stems = ["pitch-shift", "dep:ort", "dep:rubato", "dep:sha2", "dep:ureq", "dep:tempfile"]

[[example]]
name = "drone_features"
required-features = ["drone"]

[build-dependencies]
cc = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }

[lints]
workspace = true
