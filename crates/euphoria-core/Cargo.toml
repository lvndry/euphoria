[package]
name = "euphoria-core"
version = "0.1.0"
description = "Key and tempo detection for music files, the library behind Euphoria"
readme = "../../README.md"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
ebur128.workspace = true
flacenc.workspace = true
hound.workspace = true
rayon.workspace = true
rusqlite.workspace = true
rustfft.workspace = true
serde.workspace = true
ssstretch = { workspace = true, optional = true }
serde_json.workspace = true
stratum-dsp.workspace = true
symphonia = { workspace = true, features = [
  "mp3",
  "aac",
  "isomp4",
  "aiff",
  "flac",
  "wav",
  "pcm",
  "id3v1",
  "id3v2",
] }
thiserror.workspace = true
walkdir.workspace = true

[dev-dependencies]
# An independent reader and writer of tags, to check ours against.
lofty.workspace = true
roxmltree.workspace = true

[features]
default = ["libkeyfinder", "pitch-shift"]
# Key detection through libkeyfinder, a C++ library found with pkg-config.
libkeyfinder = ["dep:cc", "dep:pkg-config"]
# Changing the key of a track with the Signalsmith Stretch pitch shifter, a
# C++ library compiled with the crate, which needs a C++ compiler but not
# libclang.
pitch-shift = ["dep:ssstretch"]

[build-dependencies]
cc = { workspace = true, optional = true }
pkg-config = { workspace = true, optional = true }

[lints]
workspace = true
