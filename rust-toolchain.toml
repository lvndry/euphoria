[toolchain]
# The channel, not a date: CI installs stable via dtolnay/rust-toolchain@stable,
# and `cargo build` on a contributor's machine installs the same channel.
# Bump this when the floor of the workspace's rust-version moves up.
channel = "stable"
# rustfmt and clippy run from the pinned channel in CI and locally.
components = ["clippy", "rustfmt"]
