[package]
name = "drone-native-cached"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-or-later"

# Deliberately separate: production workspace/MSRV/defaults do not change.
[workspace]

[dependencies]
anyhow = "1.0.100"
bytemuck = "=1.25.0"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.177"
libloading = "0.9.0"
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "std",
  "load-dynamic",
  "api-31",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
