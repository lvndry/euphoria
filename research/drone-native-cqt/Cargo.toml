[package]
name = "drone-native-cqt"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-or-later"
build = "build.rs"

[workspace]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.7", features = ["derive"] }
drone-native-cached = { path = "../drone-native-cached" }
half = "2.7.1"
libloading = "0.9.0"
rustfft = "6.4.1"
serde_json = "1.0.154"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
