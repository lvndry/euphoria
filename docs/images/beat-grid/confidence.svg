<svg xmlns="http://www.w3.org/2000/svg" width="800" height="292" viewBox="0 0 800 292" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">How often the beat grid is right at each confidence</title>
<desc id="chart-desc">Horizontal bars of how often the beat grid is right on the 100 held out GTZAN disco and hip hop excerpts, by confidence: 97.2% of the 36 rated high, 100% of the 22 rated medium and 64.3% of the 42 rated low, against 84% of all excerpts.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.series-line { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-wash { fill: #2a78d6; fill-opacity: 0.10; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .series-line { stroke: #3987e5; }
  .series-fill, .series-wash { fill: #3987e5; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="291" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">How often the beat grid is right at each confidence</text>
<text x="24" y="58" class="subtitle" text-anchor="start">100 held out GTZAN disco and hip hop excerpts. High and medium grids are almost always right.</text>
<line x1="150" y1="96" x2="150" y2="228" class="axis"/>
<text x="150" y="248" class="tick" text-anchor="middle">0%</text>
<line x1="287.5" y1="96" x2="287.5" y2="228" class="grid"/>
<text x="287.5" y="248" class="tick" text-anchor="middle">25%</text>
<line x1="425" y1="96" x2="425" y2="228" class="grid"/>
<text x="425" y="248" class="tick" text-anchor="middle">50%</text>
<line x1="562.5" y1="96" x2="562.5" y2="228" class="grid"/>
<text x="562.5" y="248" class="tick" text-anchor="middle">75%</text>
<line x1="700" y1="96" x2="700" y2="228" class="grid"/>
<text x="700" y="248" class="tick" text-anchor="middle">100%</text>
<line x1="612" y1="88" x2="612" y2="228" class="reference"/>
<text x="612" y="82" class="tick" text-anchor="middle">All excerpts 84%</text>
<text x="425" y="272" class="label" text-anchor="middle">Share of excerpts whose grid is right</text>
<text x="136" y="122.5" class="label" text-anchor="end">High, 36</text>
<path class="series-fill" d="M150,108 H680.6 Q684.6,108 684.6,112 V124 Q684.6,128 680.6,128 H150 Z"/>
<text x="694.6" y="122.5" class="value" text-anchor="start">97.2%</text>
<text x="136" y="166.5" class="label" text-anchor="end">Medium, 22</text>
<path class="series-fill" d="M150,152 H696 Q700,152 700,156 V168 Q700,172 696,172 H150 Z"/>
<text x="710" y="166.5" class="value" text-anchor="start">100.0%</text>
<text x="136" y="210.5" class="label" text-anchor="end">Low, 42</text>
<path class="series-fill" d="M150,196 H499.65 Q503.65,196 503.65,200 V212 Q503.65,216 499.65,216 H150 Z"/>
<text x="513.65" y="210.5" class="value" text-anchor="start">64.3%</text>
</svg>
