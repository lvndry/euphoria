<text x="698" y="197" class="on-weak" text-anchor="middle">no fit</text>
<rect x="731" y="156" width="62" height="54" rx="6" class="fill-3"/>
<text x="762" y="178" class="value on-weak" text-anchor="middle">12B</text>
<text x="762" y="197" class="on-weak" text-anchor="middle">no fit</text>
