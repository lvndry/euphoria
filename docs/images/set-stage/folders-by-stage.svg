<svg xmlns="http://www.w3.org/2000/svg" width="800" height="344" viewBox="0 0 800 344" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">The stage Euphoria gives to tracks of each folder</title>
<desc id="chart-desc">Stacked bars of the share of tracks given warm-up, build and peak, by the folder they were filed in. Of the tracks in the warmup folder 85 percent get warm-up. Of build, 70 percent get build. Of peak, 91 percent get peak. Tracks filed as closing spread over build 51 percent and peak 39 percent, which is why there is no closing stage.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.value-light { fill: #ffffff; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.stage-0 { fill: #b9d3f2; }
.stage-1 { fill: #6aa3e8; }
.stage-2 { fill: #2a78d6; }
.gap { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .axis { stroke: #383835; }
  .stage-0 { fill: #1f4a82; }
  .stage-1 { fill: #3987e5; }
  .stage-2 { fill: #8fbcf2; }
  .value-light { fill: #f0efec; }
  .gap { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="343" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">The stage Euphoria gives to tracks of each folder</text>
<text x="24" y="58" class="subtitle" text-anchor="start">Share of the tracks of each folder given each stage, tested on genres the weights never saw.</text>
<rect x="120" y="82" width="14" height="14" rx="3" class="stage-0"/>
<text x="142" y="94" class="label" text-anchor="start">Warm-up</text>
<rect x="230" y="82" width="14" height="14" rx="3" class="stage-1"/>
<text x="252" y="94" class="label" text-anchor="start">Build</text>
<rect x="340" y="82" width="14" height="14" rx="3" class="stage-2"/>
<text x="362" y="94" class="label" text-anchor="start">Peak</text>
<text x="106" y="147" class="label" text-anchor="end">warmup</text>
<text x="106" y="164" class="tick" text-anchor="end">20 tracks</text>
<rect x="120" y="128" width="544" height="28" class="stage-0 gap"/>
<text x="392" y="147" class="value" text-anchor="middle">85%</text>
<rect x="664" y="128" width="32" height="28" class="stage-1 gap"/>
<rect x="696" y="128" width="64" height="28" class="stage-2 gap"/>
<text x="728" y="147" class="value-light" text-anchor="middle">10%</text>
<text x="106" y="195" class="label" text-anchor="end">build</text>
<text x="106" y="212" class="tick" text-anchor="end">158 tracks</text>
<rect x="120" y="176" width="157.97" height="28" class="stage-0 gap"/>
<text x="198.99" y="195" class="value" text-anchor="middle">25%</text>
<rect x="277.97" y="176" width="449.62" height="28" class="stage-1 gap"/>
<text x="502.78" y="195" class="value-light" text-anchor="middle">70%</text>
<rect x="727.59" y="176" width="32.41" height="28" class="stage-2 gap"/>
<text x="106" y="243" class="label" text-anchor="end">peak</text>
<text x="106" y="260" class="tick" text-anchor="end">313 tracks</text>
<rect x="120" y="224" width="8.18" height="28" class="stage-0 gap"/>
<rect x="128.18" y="224" width="51.12" height="28" class="stage-1 gap"/>
<text x="153.74" y="243" class="value-light" text-anchor="middle">8%</text>
<rect x="179.3" y="224" width="580.7" height="28" class="stage-2 gap"/>
<text x="469.65" y="243" class="value-light" text-anchor="middle">91%</text>
<text x="106" y="291" class="label" text-anchor="end">closing</text>
<text x="106" y="308" class="tick" text-anchor="end">70 tracks</text>
<rect x="120" y="272" width="64" height="28" class="stage-0 gap"/>
<text x="152" y="291" class="value" text-anchor="middle">10%</text>
<rect x="184" y="272" width="329.14" height="28" class="stage-1 gap"/>
<text x="348.57" y="291" class="value-light" text-anchor="middle">51%</text>
<rect x="513.14" y="272" width="246.86" height="28" class="stage-2 gap"/>
<text x="636.57" y="291" class="value-light" text-anchor="middle">39%</text>
</svg>
