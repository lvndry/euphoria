<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">How much gain a track gets</title>
<desc id="chart-desc">Line chart of the gain applied against the true peak of the original for a track that wants 6 dB. Up to a true peak of -4 dBTP the track gets the full 6 dB. Above that the gain falls one dB for every dB of peak, because the limiter may turn peaks down by 3 dB at most under a ceiling of -1 dBTP, down to 2 dB at 0 dBTP.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.series-line { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-wash { fill: #2a78d6; fill-opacity: 0.10; }
.muted-fill { fill: #898781; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .series-line { stroke: #3987e5; }
  .series-fill, .series-wash { fill: #3987e5; }
  .muted-fill { fill: #898781; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="379" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">How much gain a track gets</text>
<text x="24" y="58" class="subtitle" text-anchor="start">A track at -15 LUFS wants +6 dB to reach -9 LUFS. Its true peak decides how much of that it gets.</text>
<line x1="80" y1="300" x2="760" y2="300" class="axis"/>
<text x="70" y="304" class="tick" text-anchor="end">+0</text>
<line x1="80" y1="251" x2="760" y2="251" class="grid"/>
<text x="70" y="255" class="tick" text-anchor="end">+2</text>
<line x1="80" y1="202" x2="760" y2="202" class="grid"/>
<text x="70" y="206" class="tick" text-anchor="end">+4</text>
<line x1="80" y1="153" x2="760" y2="153" class="grid"/>
<text x="70" y="157" class="tick" text-anchor="end">+6</text>
<line x1="80" y1="104" x2="760" y2="104" class="grid"/>
<text x="70" y="108" class="tick" text-anchor="end">+8</text>
<text x="80" y="320" class="tick" text-anchor="middle">-14</text>
<text x="177.14" y="320" class="tick" text-anchor="middle">-12</text>
<text x="274.29" y="320" class="tick" text-anchor="middle">-10</text>
<text x="371.43" y="320" class="tick" text-anchor="middle">-8</text>
<text x="468.57" y="320" class="tick" text-anchor="middle">-6</text>
<text x="565.71" y="320" class="tick" text-anchor="middle">-4</text>
<text x="662.86" y="320" class="tick" text-anchor="middle">-2</text>
<text x="760" y="320" class="tick" text-anchor="middle">0</text>
<text x="420" y="344" class="label" text-anchor="middle">True peak of the original, in dBTP</text>
<text x="24" y="78" class="label" text-anchor="start">Gain applied, in dB</text>
<line x1="565.71" y1="104" x2="565.71" y2="300" class="reference"/>
<polyline points="80,153 92.14,153 104.29,153 116.43,153 128.57,153 140.71,153 152.86,153 165,153 177.14,153 189.29,153 201.43,153 213.57,153 225.71,153 237.86,153 250,153 262.14,153 274.29,153 286.43,153 298.57,153 310.71,153 322.86,153 335,153 347.14,153 359.29,153 371.43,153 383.57,153 395.71,153 407.86,153 420,153 432.14,153 444.29,153 456.43,153 468.57,153 480.71,153 492.86,153 505,153 517.14,153 529.29,153 541.43,153 553.57,153 565.71,153 577.86,159.12 590,165.25 602.14,171.38 614.29,177.5 626.43,183.62 638.57,189.75 650.71,195.88 662.86,202 675,208.12 687.14,214.25 699.29,220.38 711.43,226.5 723.57,232.62 735.71,238.75 747.86,244.88 760,251" class="series-line"/>
<circle cx="565.71" cy="153" r="5" class="series-fill ring"/>
<text x="99.43" y="141" class="label" text-anchor="start">Target reached: +6 dB</text>
<text x="577.71" y="141" class="label" text-anchor="start">Capped from here on</text>
<text x="752" y="279" class="label" text-anchor="end">A peak at 0 dBTP gets +2 dB</text>
</svg>
