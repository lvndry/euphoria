<svg xmlns="http://www.w3.org/2000/svg" width="800" height="544" viewBox="0 0 800 544" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Section boundaries by genre, SALAMI live recordings</title>
<desc id="chart-desc">Dot plot, one row per genre group of the SALAMI test tracks: All test tracks (216 tracks), previous 21.3%, Euphoria 48.8%, Foote 45.1%; Dance-like (138 tracks), previous 21.5%, Euphoria 48.4%, Foote 45.6%; Rock (37 tracks), previous 21.4%, Euphoria 52.4%, Foote 45.8%; Folk and country (20 tracks), previous 25.1%, Euphoria 56.3%, Foote 49.9%; Funk and soul (12 tracks), previous 29.2%, Euphoria 49.8%, Foote 44.2%; Jazz (11 tracks), previous 14.7%, Euphoria 40.2%, Foote 38.9%; Jam band (12 tracks), previous 16.3%, Euphoria 48.0%, Foote 47.9%; Blues (6 tracks), previous 29.9%, Euphoria 46.7%, Foote 42.5%; Electronic (8 tracks), previous 23.6%, Euphoria 53.4%, Foote 45.8%. Euphoria's boundaries score above its previous section changes in every group.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.bracket { stroke: #52514e; stroke-width: 1.5; fill: none; }
.connector { stroke: #c3c2b7; stroke-width: 2; fill: none; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-1-fill { fill: #2a78d6; }
.series-2-fill { fill: #eb6834; }
.series-3-fill { fill: #1baf7a; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
.halo { stroke: #fcfcfb; stroke-width: 4px; stroke-linejoin: round; paint-order: stroke; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis, .connector { stroke: #383835; }
  .bracket { stroke: #c3c2b7; }
  .series-fill, .series-1-fill { fill: #3987e5; }
  .series-2-fill { fill: #d95926; }
  .series-3-fill { fill: #199e70; }
  .ring, .halo { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="543" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">Section boundaries by genre, SALAMI live recordings</text>
<text x="24" y="58" class="subtitle" text-anchor="start">F-measure within 3 s against the functional annotations, test tracks. Tracks in brackets.</text>
