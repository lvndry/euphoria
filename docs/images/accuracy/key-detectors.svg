<svg xmlns="http://www.w3.org/2000/svg" width="800" height="272" viewBox="0 0 800 272" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Key accuracy of drone-v1 and libkeyfinder</title>
<desc id="chart-desc">Dot plot of key accuracy on the 604 GiantSteps Key previews. drone-v1 is exact on 68.4% and scores 74.7% MIREX; libkeyfinder with tuning correction is exact on 60.6% and scores 69.4%.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.bracket { stroke: #52514e; stroke-width: 1.5; fill: none; }
.connector { stroke: #c3c2b7; stroke-width: 2; fill: none; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-1-fill { fill: #2a78d6; }
.series-2-fill { fill: #eb6834; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
.halo { stroke: #fcfcfb; stroke-width: 4px; stroke-linejoin: round; paint-order: stroke; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis, .connector { stroke: #383835; }
  .bracket { stroke: #c3c2b7; }
  .series-fill, .series-1-fill { fill: #3987e5; }
  .series-2-fill { fill: #d95926; }
  .ring, .halo { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="271" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">Key accuracy of drone-v1 and libkeyfinder</text>
<text x="24" y="58" class="subtitle" text-anchor="start">604 GiantSteps Key previews, held out from training. Euphoria ships drone-v1.</text>
<circle cx="30" cy="86" r="6" class="series-1-fill ring"/>
<text x="44" y="90" class="label" text-anchor="start">Exact</text>
<circle cx="130" cy="86" r="6" class="series-2-fill ring"/>
<text x="144" y="90" class="label" text-anchor="start">MIREX score</text>
<line x1="190" y1="120" x2="190" y2="208" class="grid"/>
<text x="190" y="228" class="tick" text-anchor="middle">50%</text>
<line x1="373.33" y1="120" x2="373.33" y2="208" class="grid"/>
<text x="373.33" y="228" class="tick" text-anchor="middle">60%</text>
<line x1="556.67" y1="120" x2="556.67" y2="208" class="grid"/>
<text x="556.67" y="228" class="tick" text-anchor="middle">70%</text>
<line x1="740" y1="120" x2="740" y2="208" class="grid"/>
<text x="740" y="228" class="tick" text-anchor="middle">80%</text>
<text x="465" y="252" class="label" text-anchor="middle">Share of the previews, or MIREX score</text>
<text x="176" y="146.5" class="value" text-anchor="end">drone-v1</text>
<line x1="527.33" y1="142" x2="642.83" y2="142" class="connector"/>
<circle cx="527.33" cy="142" r="6" class="series-1-fill ring"/>
<circle cx="642.83" cy="142" r="6" class="series-2-fill ring"/>
<text x="515.33" y="146.5" class="value halo" text-anchor="end">68.4%</text>
<text x="654.83" y="146.5" class="value halo" text-anchor="start">74.7%</text>
<text x="176" y="190.5" class="label" text-anchor="end">libkeyfinder</text>
<line x1="384.33" y1="186" x2="545.67" y2="186" class="connector"/>
<circle cx="384.33" cy="186" r="6" class="series-1-fill ring"/>
<circle cx="545.67" cy="186" r="6" class="series-2-fill ring"/>
<text x="372.33" y="190.5" class="value halo" text-anchor="end">60.6%</text>
<text x="557.67" y="190.5" class="value halo" text-anchor="start">69.4%</text>
</svg>
