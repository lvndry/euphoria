<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">How bit rate and cutoff make the verdict</title>
<desc id="chart-desc">Scatter of the lowest cutoff of each encoding against its measured average bit rate, over the verdict zones. Below 144 kbit/s is weak on a big system, 144 to 199 acceptable, 200 and above good. Below 144 kbit/s the verdict stays weak regardless of cutoff. From 144 kbit/s, a step line marks the cutoff below which the file is likely re-encoded: 15.5 kHz to 199 kbit/s, 18 kHz to 287 and 19.5 kHz from 288. The lowest cutoff of each encoding made once from a lossless source sits above the line, MP3 at 256 kbit/s closest at 19.3 kHz, 1.3 kHz above it. The lowest cutoff of each transcode to a higher bit rate sits below it. Some files have no cutoff and cannot be identified as re-encoded. Lossless files, not shown, are likely re-encoded below 19 kHz.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #52514e; stroke-width: 2; fill: none; stroke-linecap: round; }
.zone { fill: #898781; fill-opacity: 0.12; }
.series-1-fill { fill: #2a78d6; }
.series-2-fill { fill: #eb6834; }
.series-3-fill { fill: #1baf7a; }
.series-1-line { stroke: #2a78d6; }
.series-2-line { stroke: #eb6834; }
.series-3-line { stroke: #1baf7a; }
.line { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .reference { stroke: #c3c2b7; }
  .zone { fill-opacity: 0.18; }
  .series-1-fill { fill: #3987e5; }
  .series-2-fill { fill: #d95926; }
  .series-3-fill { fill: #199e70; }
  .series-1-line { stroke: #3987e5; }
  .series-2-line { stroke: #d95926; }
  .series-3-line { stroke: #199e70; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="499" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">How bit rate and cutoff make the verdict</text>
<text x="24" y="58" class="subtitle" text-anchor="start">Bit rate sets Weak, Acceptable or Good. From 144 kbit/s, a cutoff below the line marks a likely re-encode.</text>
<circle cx="30" cy="85" r="5" class="series-1-fill ring"/>
<text x="42" y="90" class="label" text-anchor="start">Encoded once from lossless</text>
<circle cx="236" cy="85" r="5" class="series-2-fill ring"/>
<text x="248" y="90" class="label" text-anchor="start">Encoded again at a higher bit rate</text>
<polygon points="232.62,430 232.62,375.96 366.15,375.96 366.15,285.9 576,285.9 576,231.86 700,231.86 700,430" class="zone"/>
