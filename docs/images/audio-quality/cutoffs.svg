<svg xmlns="http://www.w3.org/2000/svg" width="800" height="756" viewBox="0 0 800 756" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Where the content stops</title>
<desc id="chart-desc">Range bars of the frequency where the content stops, for seven tracks per encoding, with a tick at the cutoff below which a file of that bit rate is likely re-encoded. Encoded once from a lossless source, every bar sits at or right of its tick: MP3 cuts at about 15.3 kHz at 96 kbit/s, 16 to 16.8 kHz at 128, 18.6 to 18.9 at 192, 19.3 to 19.6 at 256 and 20.1 to 20.3 at 320; the AAC encoders cut higher or not at all. Transcoded to a higher bit rate or to FLAC, the bars stay where the low bit rate source put them, at 16 to 18.9 kHz, left of their tick.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #52514e; stroke-width: 2; fill: none; stroke-linecap: round; }
.zone { fill: #898781; fill-opacity: 0.12; }
.series-1-fill { fill: #2a78d6; }
.series-2-fill { fill: #eb6834; }
.series-3-fill { fill: #1baf7a; }
.series-1-line { stroke: #2a78d6; }
.series-2-line { stroke: #eb6834; }
.series-3-line { stroke: #1baf7a; }
.line { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .reference { stroke: #c3c2b7; }
  .zone { fill-opacity: 0.18; }
  .series-1-fill { fill: #3987e5; }
  .series-2-fill { fill: #d95926; }
  .series-3-fill { fill: #199e70; }
  .series-1-line { stroke: #3987e5; }
  .series-2-line { stroke: #d95926; }
  .series-3-line { stroke: #199e70; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="755" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">Where the content stops</text>
<text x="24" y="58" class="subtitle" text-anchor="start">Cutoff of seven tracks per encoding, lowest to highest. A transcode keeps the cutoff of the file it was made from.</text>
<rect x="24" y="81" width="14" height="10" rx="3" class="series-1-fill"/>
<text x="44" y="90" class="label" text-anchor="start">Encoded once from lossless</text>
<rect x="236" y="81" width="14" height="10" rx="3" class="series-2-fill"/>
<text x="256" y="90" class="label" text-anchor="start">Encoded again at a higher bit rate</text>
<line x1="490" y1="80" x2="490" y2="92" class="reference"/>
<text x="502" y="90" class="label" text-anchor="start">Likely re-encoded when the content stops left of it</text>
<line x1="220" y1="136" x2="220" y2="696" class="grid"/>
<text x="220" y="716" class="tick" text-anchor="middle">14 kHz</text>
<line x1="325" y1="136" x2="325" y2="696" class="grid"/>
<text x="325" y="716" class="tick" text-anchor="middle">16 kHz</text>
<line x1="430" y1="136" x2="430" y2="696" class="grid"/>
<text x="430" y="716" class="tick" text-anchor="middle">18 kHz</text>
<line x1="535" y1="136" x2="535" y2="696" class="grid"/>
<text x="535" y="716" class="tick" text-anchor="middle">20 kHz</text>
<line x1="640" y1="136" x2="640" y2="696" class="grid"/>
<text x="640" y="716" class="tick" text-anchor="middle">22 kHz</text>
<text x="430" y="740" class="label" text-anchor="middle">Frequency where the content stops</text>
<text x="24" y="140" class="value" text-anchor="start">From a lossless source</text>
<text x="206" y="168.5" class="label" text-anchor="end">MP3 96</text>
<rect x="283" y="158" width="10.5" height="12" rx="4" class="series-1-fill"/>
<line x1="246.25" y1="155" x2="246.25" y2="173" class="reference"/>
<text x="206" y="192.5" class="label" text-anchor="end">MP3 128</text>
<rect x="325" y="182" width="42" height="12" rx="4" class="series-1-fill"/>
<line x1="246.25" y1="179" x2="246.25" y2="197" class="reference"/>
<text x="206" y="216.5" class="label" text-anchor="end">MP3 192</text>
<rect x="461.5" y="206" width="15.75" height="12" rx="4" class="series-1-fill"/>
<line x1="298.75" y1="203" x2="298.75" y2="221" class="reference"/>
<text x="206" y="240.5" class="label" text-anchor="end">MP3 256</text>
<rect x="498.25" y="230" width="15.75" height="12" rx="4" class="series-1-fill"/>
<line x1="430" y1="227" x2="430" y2="245" class="reference"/>
<text x="206" y="264.5" class="label" text-anchor="end">MP3 320</text>
<rect x="540.25" y="254" width="10.5" height="12" rx="4" class="series-1-fill"/>
<line x1="508.75" y1="251" x2="508.75" y2="269" class="reference"/>
<text x="206" y="288.5" class="label" text-anchor="end">FFmpeg AAC 96</text>
<rect x="319.75" y="278" width="42" height="12" rx="4" class="series-1-fill"/>
<line x1="246.25" y1="275" x2="246.25" y2="293" class="reference"/>
<text x="206" y="312.5" class="label" text-anchor="end">FFmpeg AAC 128</text>
<rect x="389.25" y="302" width="8" height="12" rx="4" class="series-1-fill"/>
<line x1="246.25" y1="299" x2="246.25" y2="317" class="reference"/>
<text x="206" y="336.5" class="label" text-anchor="end">FFmpeg AAC 192</text>
<rect x="496.88" y="326" width="8" height="12" rx="4" class="series-1-fill"/>
<line x1="298.75" y1="323" x2="298.75" y2="341" class="reference"/>
<text x="206" y="360.5" class="label" text-anchor="end">FFmpeg AAC 256</text>
<line x1="430" y1="347" x2="430" y2="365" class="reference"/>
<text x="652" y="360.5" class="tick" text-anchor="start">no cutoff in 7 of 7</text>
<text x="206" y="384.5" class="label" text-anchor="end">FFmpeg AAC 320</text>
<line x1="430" y1="371" x2="430" y2="389" class="reference"/>
<text x="652" y="384.5" class="tick" text-anchor="start">no cutoff in 7 of 7</text>
<text x="206" y="408.5" class="label" text-anchor="end">Apple AAC 96</text>
<rect x="300" y="398" width="8" height="12" rx="4" class="series-1-fill"/>
<line x1="246.25" y1="395" x2="246.25" y2="413" class="reference"/>
<text x="652" y="408.5" class="tick" text-anchor="start">no cutoff in 1 of 7</text>
<text x="206" y="432.5" class="label" text-anchor="end">Apple AAC 128</text>
<rect x="382.75" y="422" width="84" height="12" rx="4" class="series-1-fill"/>
<line x1="246.25" y1="419" x2="246.25" y2="437" class="reference"/>
<text x="652" y="432.5" class="tick" text-anchor="start">no cutoff in 2 of 7</text>
<text x="206" y="456.5" class="label" text-anchor="end">Apple AAC 192</text>
<rect x="346" y="446" width="173.25" height="12" rx="4" class="series-1-fill"/>
<line x1="298.75" y1="443" x2="298.75" y2="461" class="reference"/>
<text x="652" y="456.5" class="tick" text-anchor="start">no cutoff in 2 of 7</text>
<text x="206" y="480.5" class="label" text-anchor="end">Apple AAC 256</text>
<rect x="457.5" y="470" width="8" height="12" rx="4" class="series-1-fill"/>
<line x1="430" y1="467" x2="430" y2="485" class="reference"/>
<text x="652" y="480.5" class="tick" text-anchor="start">no cutoff in 6 of 7</text>
<text x="206" y="504.5" class="label" text-anchor="end">Apple AAC 320</text>
<line x1="508.75" y1="491" x2="508.75" y2="509" class="reference"/>
<text x="652" y="504.5" class="tick" text-anchor="start">no cutoff in 7 of 7</text>
<text x="24" y="540" class="value" text-anchor="start">Transcoded from a low bit rate</text>
<text x="206" y="568.5" class="label" text-anchor="end">MP3 128 to MP3 320</text>
<rect x="325" y="558" width="42" height="12" rx="4" class="series-2-fill"/>
<line x1="508.75" y1="555" x2="508.75" y2="573" class="reference"/>
<text x="206" y="592.5" class="label" text-anchor="end">MP3 128 to FLAC</text>
<rect x="325" y="582" width="42" height="12" rx="4" class="series-2-fill"/>
<line x1="482.5" y1="579" x2="482.5" y2="597" class="reference"/>
<text x="206" y="616.5" class="label" text-anchor="end">MP3 192 to MP3 320</text>
<rect x="461.5" y="606" width="15.75" height="12" rx="4" class="series-2-fill"/>
<line x1="508.75" y1="603" x2="508.75" y2="621" class="reference"/>
<text x="652" y="616.5" class="tick" text-anchor="start">no cutoff in 1 of 7</text>
<text x="206" y="640.5" class="label" text-anchor="end">FFmpeg AAC 128 to 256</text>
<rect x="386.62" y="630" width="8" height="12" rx="4" class="series-2-fill"/>
<line x1="430" y1="627" x2="430" y2="645" class="reference"/>
<text x="206" y="664.5" class="label" text-anchor="end">MP3 128 to Apple AAC 256</text>
<rect x="325" y="654" width="47.25" height="12" rx="4" class="series-2-fill"/>
<line x1="430" y1="651" x2="430" y2="669" class="reference"/>
<text x="206" y="688.5" class="label" text-anchor="end">Apple AAC 128 to 320</text>
<rect x="382.75" y="678" width="73.5" height="12" rx="4" class="series-2-fill"/>
<line x1="508.75" y1="675" x2="508.75" y2="693" class="reference"/>
<text x="652" y="688.5" class="tick" text-anchor="start">no cutoff in 2 of 7</text>
</svg>
