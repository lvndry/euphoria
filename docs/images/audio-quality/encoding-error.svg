<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">How much the encoder changes below 15 kHz</title>
<desc id="chart-desc">Line chart of the median encoding error below 15 kHz against the bit rate the encoder was set to, for three encoders. MP3 goes from -24 dB at 96 kbit/s to -30 dB at 192, then drops to -47 dB at 256 and -52 dB at 320: its big step is from 192 to 256. FFmpeg AAC goes from -26 to -44 dB and Apple AAC from -29 to -43 dB, with their biggest steps between 128 and 192 kbit/s.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #52514e; stroke-width: 2; fill: none; stroke-linecap: round; }
.zone { fill: #898781; fill-opacity: 0.12; }
.series-1-fill { fill: #2a78d6; }
.series-2-fill { fill: #eb6834; }
.series-3-fill { fill: #1baf7a; }
.series-1-line { stroke: #2a78d6; }
.series-2-line { stroke: #eb6834; }
.series-3-line { stroke: #1baf7a; }
.line { stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .reference { stroke: #c3c2b7; }
  .zone { fill-opacity: 0.18; }
  .series-1-fill { fill: #3987e5; }
  .series-2-fill { fill: #d95926; }
  .series-3-fill { fill: #199e70; }
  .series-1-line { stroke: #3987e5; }
  .series-2-line { stroke: #d95926; }
  .series-3-line { stroke: #199e70; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="379" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">How much the encoder changes below 15 kHz</text>
<text x="24" y="58" class="subtitle" text-anchor="start">Median difference from the source, relative to the music. Lower is closer to the original.</text>
<circle cx="30" cy="85" r="5" class="series-1-fill ring"/>
<text x="42" y="90" class="label" text-anchor="start">MP3 (LAME)</text>
<circle cx="170" cy="85" r="5" class="series-2-fill ring"/>
<text x="182" y="90" class="label" text-anchor="start">FFmpeg AAC</text>
<circle cx="310" cy="85" r="5" class="series-3-fill ring"/>
<text x="322" y="90" class="label" text-anchor="start">Apple AAC</text>
<line x1="80" y1="110" x2="640" y2="110" class="grid"/>
<text x="70" y="114" class="tick" text-anchor="end">-20 dB</text>
<line x1="80" y1="167.14" x2="640" y2="167.14" class="grid"/>
<text x="70" y="171.14" class="tick" text-anchor="end">-30 dB</text>
<line x1="80" y1="224.29" x2="640" y2="224.29" class="grid"/>
<text x="70" y="228.29" class="tick" text-anchor="end">-40 dB</text>
<line x1="80" y1="281.43" x2="640" y2="281.43" class="grid"/>
<text x="70" y="285.43" class="tick" text-anchor="end">-50 dB</text>
<line x1="80" y1="310" x2="640" y2="310" class="axis"/>
<text x="115" y="330" class="tick" text-anchor="middle">96</text>
<text x="185" y="330" class="tick" text-anchor="middle">128</text>
<text x="325" y="330" class="tick" text-anchor="middle">192</text>
<text x="465" y="330" class="tick" text-anchor="middle">256</text>
<text x="605" y="330" class="tick" text-anchor="middle">320</text>
<text x="360" y="354" class="label" text-anchor="middle">Bit rate the encoder was set to, kbit/s</text>
<polyline points="115,133.43 185,142 325,168.86 465,262.57 605,293.43" class="series-1-line line"/>
<circle cx="115" cy="133.43" r="4" class="series-1-fill ring"/>
<circle cx="185" cy="142" r="4" class="series-1-fill ring"/>
<circle cx="325" cy="168.86" r="4" class="series-1-fill ring"/>
<circle cx="465" cy="262.57" r="4" class="series-1-fill ring"/>
<circle cx="605" cy="293.43" r="4" class="series-1-fill ring"/>
<text x="617" y="297.93" class="label" text-anchor="start">MP3 (LAME) -52 dB</text>
<polyline points="115,141.43 185,172.86 325,201.43 465,238 605,247.71" class="series-2-line line"/>
<circle cx="115" cy="141.43" r="4" class="series-2-fill ring"/>
<circle cx="185" cy="172.86" r="4" class="series-2-fill ring"/>
<circle cx="325" cy="201.43" r="4" class="series-2-fill ring"/>
<circle cx="465" cy="238" r="4" class="series-2-fill ring"/>
<circle cx="605" cy="247.71" r="4" class="series-2-fill ring"/>
<text x="617" y="261.71" class="label" text-anchor="start">FFmpeg AAC -44 dB</text>
<polyline points="115,163.71 185,182 325,222.57 465,236.86 605,243.71" class="series-3-line line"/>
<circle cx="115" cy="163.71" r="4" class="series-3-fill ring"/>
<circle cx="185" cy="182" r="4" class="series-3-fill ring"/>
<circle cx="325" cy="222.57" r="4" class="series-3-fill ring"/>
<circle cx="465" cy="236.86" r="4" class="series-3-fill ring"/>
<circle cx="605" cy="243.71" r="4" class="series-3-fill ring"/>
<text x="617" y="239.71" class="label" text-anchor="start">Apple AAC -43 dB</text>
<text x="411.25" y="275.71" class="label" text-anchor="end">MP3's big step, 192 to 256</text>
</svg>
