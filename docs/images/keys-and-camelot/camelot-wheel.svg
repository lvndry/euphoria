<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">The Camelot wheel, from 8A</title>
<desc id="chart-desc">The Camelot wheel as two rings of twelve: minor keys, A, inside and major keys, B, outside, with 12 at the top and the numbers rising clockwise by a fifth. From 8A, A minor, the moves that mix in key are highlighted strongly: 8A itself, 7A D minor and 9A E minor a fifth away, and 8B C major, the relative major. The bolder moves are highlighted lightly: 7B F major, the diagonal; 10A B minor, the energy boost; 11B A major, the mood change; and 3A Bb minor, the semitone boost. The other keys are plain.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.code { font-size: 13px; font-weight: 600; }
.key { font-size: 11px; }
.cell { stroke: #fcfcfb; stroke-width: 2; }
.cell-plain { fill: #f0efec; }
.cell-start { fill: #0b0b0b; }
.cell-near { fill: #1c5cab; }
.cell-bold { fill: #86b6ef; }
.on-plain { fill: #52514e; }
.on-plain.code { fill: #0b0b0b; }
.on-start { fill: #fcfcfb; }
.on-near { fill: #ffffff; }
.on-bold { fill: #0b0b0b; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .cell { stroke: #1a1a19; }
  .cell-plain { fill: #2c2c2a; }
  .cell-start { fill: #f0efec; }
  .cell-near { fill: #6da7ec; }
  .cell-bold { fill: #184f95; }
  .on-plain { fill: #c3c2b7; }
  .on-plain.code { fill: #f0efec; }
  .on-start { fill: #1a1a19; }
  .on-near { fill: #0b0b0b; }
  .on-bold { fill: #f0efec; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="519" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">The Camelot wheel, from 8A</text>
<text x="24" y="58" class="subtitle" text-anchor="start">Where a track in A minor can go next. Numbers step by a fifth clockwise and wrap from 12 to 1.</text>
