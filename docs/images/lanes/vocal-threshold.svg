<rect x="265.93" y="271" width="11.4" height="19" class="level-fill"/>
<rect x="279.33" y="271" width="11.4" height="19" class="level-fill"/>
<rect x="292.72" y="281.86" width="11.4" height="8.14" class="level-fill"/>
