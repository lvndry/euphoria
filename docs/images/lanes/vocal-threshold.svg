<rect x="627.6" y="287.29" width="11.4" height="2.71" class="level-fill"/>
<line x1="64" y1="173.29" x2="640" y2="173.29" class="threshold"/>
<text x="650" y="169.29" class="threshold-label" text-anchor="start">Threshold</text>
<text x="650" y="186.29" class="threshold-label" text-anchor="start">-37 dB</text>
<text x="352" y="314" class="label" text-anchor="middle">Window, every 4 seconds from the start of the track</text>
<text x="24" y="88" class="label" text-anchor="start">dB below full scale</text>
</svg>
