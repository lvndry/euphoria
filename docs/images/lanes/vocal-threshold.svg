<rect x="332.91" y="157" width="11.4" height="133" class="level-voice"/>
<rect x="346.3" y="132.57" width="11.4" height="157.43" class="level-voice"/>
<rect x="359.7" y="124.43" width="11.4" height="165.57" class="level-voice"/>
