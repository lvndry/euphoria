<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Level of the vocals stem per window and the threshold</title>
<desc id="chart-desc">Bar chart of the level of the vocals stem of one separated track in each 8 second window, in dB below full scale. Windows with vocals sit between about -16 and -31 dB; windows without sit between about -69 and -79 dB. A threshold line at -37 dB, 20 dB under the level the loudest tenth of the windows reach, falls in the empty space between them, so the windows above it are drawn as vocals.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.series-line { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-wash { fill: #2a78d6; fill-opacity: 0.10; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .series-line { stroke: #3987e5; }
  .series-fill, .series-wash { fill: #3987e5; }
  .ring { stroke: #1a1a19; }
}

.lane-back { fill: #e1e0d9; fill-opacity: 0.55; }
.wave { fill: #898781; fill-opacity: 0.55; }
.energy-bar { fill: #2a78d6; fill-opacity: 0.7; }
.vocal-fill { fill: #2a78d6; fill-opacity: 0.7; }
.lane-name { fill: #52514e; font-size: 11px; }
.bubble { fill: #0b0b0b; }
.bubble-text { fill: #fcfcfb; font-size: 12px; }
.pointer { stroke: #0b0b0b; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.threshold { stroke: #c4472f; stroke-width: 1.5; fill: none; }
.threshold-label { fill: #c4472f; font-size: 13px; }
.level-fill { fill: #898781; }
.level-voice { fill: #2a78d6; }
@media (prefers-color-scheme: dark) {
  .lane-back { fill: #383835; fill-opacity: 0.8; }
  .wave { fill: #c3c2b7; fill-opacity: 0.5; }
  .energy-bar, .vocal-fill, .level-voice { fill: #3987e5; }
  .lane-name { fill: #c3c2b7; }
  .bubble { fill: #f0efec; }
  .bubble-text { fill: #1a1a19; }
  .pointer { stroke: #f0efec; }
  .threshold, .threshold-label { stroke: #e8765f; }
  .threshold-label { fill: #e8765f; stroke: none; }
  .level-fill { fill: #898781; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="359" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">How the vocals lane decides</text>
<text x="24" y="58" class="subtitle" text-anchor="start">The level of the vocals stem in each window, against the line 20 dB under the track's own vocal level.</text>
<line x1="64" y1="290" x2="640" y2="290" class="grid"/>
<text x="54" y="294" class="tick" text-anchor="end">-80</text>
