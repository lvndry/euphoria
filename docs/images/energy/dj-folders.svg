<svg xmlns="http://www.w3.org/2000/svg" width="800" height="276" viewBox="0 0 800 276" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Average rating of one DJ's folders</title>
<desc id="chart-desc">Dot plot on the rating scale from 1 to 10 of the average rating of three folders in one DJ's library of 494 house tracks: warm up 5.0, build 5.9 and peak 6.3. The rating rises in the right order, but the three averages sit within about one point of each other.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.series-line { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-wash { fill: #2a78d6; fill-opacity: 0.10; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .series-line { stroke: #3987e5; }
  .series-fill, .series-wash { fill: #3987e5; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="275" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">Average rating of one DJ's folders</text>
<text x="24" y="58" class="subtitle" text-anchor="start">494 house tracks sorted by their owner. The order is right, the steps are small.</text>
<line x1="130" y1="96" x2="130" y2="216" class="grid"/>
<text x="130" y="236" class="tick" text-anchor="middle">1</text>
<line x1="200" y1="96" x2="200" y2="216" class="grid"/>
<text x="200" y="236" class="tick" text-anchor="middle">2</text>
<line x1="270" y1="96" x2="270" y2="216" class="grid"/>
<text x="270" y="236" class="tick" text-anchor="middle">3</text>
<line x1="340" y1="96" x2="340" y2="216" class="grid"/>
<text x="340" y="236" class="tick" text-anchor="middle">4</text>
<line x1="410" y1="96" x2="410" y2="216" class="grid"/>
<text x="410" y="236" class="tick" text-anchor="middle">5</text>
<line x1="480" y1="96" x2="480" y2="216" class="grid"/>
<text x="480" y="236" class="tick" text-anchor="middle">6</text>
<line x1="550" y1="96" x2="550" y2="216" class="grid"/>
<text x="550" y="236" class="tick" text-anchor="middle">7</text>
<line x1="620" y1="96" x2="620" y2="216" class="grid"/>
<text x="620" y="236" class="tick" text-anchor="middle">8</text>
<line x1="690" y1="96" x2="690" y2="216" class="grid"/>
<text x="690" y="236" class="tick" text-anchor="middle">9</text>
<line x1="760" y1="96" x2="760" y2="216" class="grid"/>
<text x="760" y="236" class="tick" text-anchor="middle">10</text>
<text x="445" y="260" class="label" text-anchor="middle">Energy rating</text>
<text x="112" y="120.5" class="label" text-anchor="end">Warm up</text>
<circle cx="410" cy="116" r="6" class="series-fill ring"/>
<text x="424" y="120.5" class="value" text-anchor="start">5.0</text>
<text x="112" y="160.5" class="label" text-anchor="end">Build</text>
<circle cx="473" cy="156" r="6" class="series-fill ring"/>
<text x="487" y="160.5" class="value" text-anchor="start">5.9</text>
<text x="112" y="200.5" class="label" text-anchor="end">Peak</text>
<circle cx="501" cy="196" r="6" class="series-fill ring"/>
<text x="515" y="200.5" class="value" text-anchor="start">6.3</text>
</svg>
