<svg xmlns="http://www.w3.org/2000/svg" width="800" height="408" viewBox="0 0 800 408" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">How often the rating and the curve disagree</title>
<desc id="chart-desc">Dot plot of the share of tracks whose rating is 2 or more steps away from the median of their own energy curve, for version 2 and version 4. Version 4 lowers it in every group: from 27% to 3.5% in one DJ library of full length tracks, from 17.5% to 4.1% in the GiantSteps previews, from 1.9% to 0.4% in DEAM and from 3.7% to 0.6% in PMEmo.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.series-line { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-wash { fill: #2a78d6; fill-opacity: 0.10; }
.muted-fill { fill: #898781; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .series-line { stroke: #3987e5; }
  .series-fill, .series-wash { fill: #3987e5; }
  .muted-fill { fill: #898781; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="407" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">How often the rating and the curve disagree</text>
<text x="24" y="58" class="subtitle" text-anchor="start">Share of tracks rated 2 or more steps away from the median of their own curve.</text>
<text x="24" y="80" class="subtitle" text-anchor="start">Grey: version 2, the whole track. Blue: version 4, the body of the curve.</text>
<line x1="250" y1="104" x2="250" y2="344" class="axis"/>
<text x="250" y="364" class="tick" text-anchor="middle">0%</text>
<line x1="372.5" y1="104" x2="372.5" y2="344" class="grid"/>
<text x="372.5" y="364" class="tick" text-anchor="middle">10%</text>
<line x1="495" y1="104" x2="495" y2="344" class="grid"/>
<text x="495" y="364" class="tick" text-anchor="middle">20%</text>
<line x1="617.5" y1="104" x2="617.5" y2="344" class="grid"/>
<text x="617.5" y="364" class="tick" text-anchor="middle">30%</text>
<line x1="740" y1="104" x2="740" y2="344" class="grid"/>
<text x="740" y="364" class="tick" text-anchor="middle">40%</text>
<text x="495" y="388" class="label" text-anchor="middle">Tracks 2 or more steps from their curve</text>
<text x="236" y="123.5" class="label" text-anchor="end">Library, afro house (20)</text>
<line x1="495" y1="119" x2="311.25" y2="119" class="reference"/>
<circle cx="495" cy="119" r="5" class="muted-fill ring"/>
<circle cx="311.25" cy="119" r="5" class="series-fill ring"/>
<text x="236" y="153.5" class="label" text-anchor="end">Library, deep house (20)</text>
<line x1="678.75" y1="149" x2="250" y2="149" class="reference"/>
<circle cx="678.75" cy="149" r="5" class="muted-fill ring"/>
<circle cx="250" cy="149" r="5" class="series-fill ring"/>
<text x="236" y="183.5" class="label" text-anchor="end">Library, melodic house (20)</text>
<line x1="617.5" y1="179" x2="250" y2="179" class="reference"/>
<circle cx="617.5" cy="179" r="5" class="muted-fill ring"/>
<circle cx="250" cy="179" r="5" class="series-fill ring"/>
<text x="236" y="213.5" class="label" text-anchor="end">Library, tech house (20)</text>
<line x1="433.75" y1="209" x2="372.5" y2="209" class="reference"/>
<circle cx="433.75" cy="209" r="5" class="muted-fill ring"/>
<circle cx="372.5" cy="209" r="5" class="series-fill ring"/>
<text x="236" y="243.5" class="label" text-anchor="end">Library, all folders (85)</text>
<line x1="580.75" y1="239" x2="292.88" y2="239" class="reference"/>
<circle cx="580.75" cy="239" r="5" class="muted-fill ring"/>
<circle cx="292.88" cy="239" r="5" class="series-fill ring"/>
<text x="236" y="273.5" class="label" text-anchor="end">GiantSteps previews (604)</text>
<line x1="464.38" y1="269" x2="300.23" y2="269" class="reference"/>
<circle cx="464.38" cy="269" r="5" class="muted-fill ring"/>
<circle cx="300.23" cy="269" r="5" class="series-fill ring"/>
<text x="236" y="303.5" class="label" text-anchor="end">DEAM excerpts (1802)</text>
<line x1="273.27" y1="299" x2="254.9" y2="299" class="reference"/>
<circle cx="273.27" cy="299" r="5" class="muted-fill ring"/>
<circle cx="254.9" cy="299" r="5" class="series-fill ring"/>
<text x="236" y="333.5" class="label" text-anchor="end">PMEmo choruses (794)</text>
<line x1="295.32" y1="329" x2="257.35" y2="329" class="reference"/>
<circle cx="295.32" cy="329" r="5" class="muted-fill ring"/>
<circle cx="257.35" cy="329" r="5" class="series-fill ring"/>
</svg>
