<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Energy curve of a two minute preview</title>
<desc id="chart-desc">Step chart of the energy rating of a two minute preview from the benchmark set, one rating every 4 seconds over 8 second windows. It starts at 10, eases down to 4 by half a minute, falls to 1 in a breakdown between about 40 and 60 seconds, jumps back to 9 and 10 at the drop just after one minute and stays high to the end. The breakdown is more than 6 LU below the loud part, so it is left out of the main body, and the preview rates 8, the mean of the body.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.series-line { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-wash { fill: #2a78d6; fill-opacity: 0.10; }
.muted-fill { fill: #898781; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .series-line { stroke: #3987e5; }
  .series-fill, .series-wash { fill: #3987e5; }
  .muted-fill { fill: #898781; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="359" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">Energy curve of a two minute preview</text>
<text x="24" y="58" class="subtitle" text-anchor="start">A rating every 4 seconds over 8 second windows. The grey band is more than 6 LU below the body.</text>
<line x1="64" y1="300" x2="680" y2="300" class="grid"/>
<text x="54" y="304" class="tick" text-anchor="end">1</text>
<line x1="64" y1="233.33" x2="680" y2="233.33" class="grid"/>
<text x="54" y="237.33" class="tick" text-anchor="end">4</text>
<line x1="64" y1="166.67" x2="680" y2="166.67" class="grid"/>
<text x="54" y="170.67" class="tick" text-anchor="end">7</text>
<line x1="64" y1="100" x2="680" y2="100" class="grid"/>
<text x="54" y="104" class="tick" text-anchor="end">10</text>
<line x1="64" y1="300" x2="680" y2="300" class="axis"/>
<text x="64" y="320" class="tick" text-anchor="middle">0:00</text>
<text x="166.67" y="320" class="tick" text-anchor="middle">0:20</text>
<text x="269.33" y="320" class="tick" text-anchor="middle">0:40</text>
<text x="372" y="320" class="tick" text-anchor="middle">1:00</text>
<text x="474.67" y="320" class="tick" text-anchor="middle">1:20</text>
<text x="577.33" y="320" class="tick" text-anchor="middle">1:40</text>
<text x="680" y="320" class="tick" text-anchor="middle">2:00</text>
<text x="372" y="344" class="label" text-anchor="middle">Time in the preview</text>
<polygon points="74.27,300 74.27,100 94.8,100 94.8,122.22 115.33,122.22 115.33,122.22 135.87,122.22 135.87,166.67 156.4,166.67 156.4,188.89 176.93,188.89 176.93,211.11 197.47,211.11 197.47,233.33 218,233.33 218,211.11 238.53,211.11 238.53,188.89 259.07,188.89 259.07,300 279.6,300 279.6,300 300.13,300 300.13,300 320.67,300 320.67,300 341.2,300 341.2,300 361.73,300 361.73,255.56 382.27,255.56 382.27,122.22 402.8,122.22 402.8,100 423.33,100 423.33,100 443.87,100 443.87,100 464.4,100 464.4,100 484.93,100 484.93,100 505.47,100 505.47,100 526,100 526,100 546.53,100 546.53,100 567.07,100 567.07,100 587.6,100 587.6,166.67 608.13,166.67 608.13,144.44 628.67,144.44 628.67,144.44 649.2,144.44 649.2,144.44 669.73,144.44 669.73,300" class="series-wash"/>
<rect x="259.07" y="100" width="102.67" height="200" class="muted-fill" fill-opacity="0.18"/>
<text x="310.4" y="92" class="label" text-anchor="middle">Left out</text>
<line x1="64" y1="144.44" x2="680" y2="144.44" class="reference"/>
<polyline points="74.27,100 94.8,100 94.8,122.22 115.33,122.22 115.33,122.22 135.87,122.22 135.87,166.67 156.4,166.67 156.4,188.89 176.93,188.89 176.93,211.11 197.47,211.11 197.47,233.33 218,233.33 218,211.11 238.53,211.11 238.53,188.89 259.07,188.89 259.07,300 279.6,300 279.6,300 300.13,300 300.13,300 320.67,300 320.67,300 341.2,300 341.2,300 361.73,300 361.73,255.56 382.27,255.56 382.27,122.22 402.8,122.22 402.8,100 423.33,100 423.33,100 443.87,100 443.87,100 464.4,100 464.4,100 484.93,100 484.93,100 505.47,100 505.47,100 526,100 526,100 546.53,100 546.53,100 567.07,100 567.07,100 587.6,100 587.6,166.67 608.13,166.67 608.13,144.44 628.67,144.44 628.67,144.44 649.2,144.44 649.2,144.44 669.73,144.44" class="series-line"/>
<text x="690" y="140.44" class="label" text-anchor="start">The preview</text>
<text x="690" y="157.44" class="label" text-anchor="start">rates 8</text>
<text x="315.53" y="286" class="label" text-anchor="middle">Breakdown</text>
<text x="371.13" y="108.89" class="label" text-anchor="end">Drop</text>
</svg>
