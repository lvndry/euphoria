<svg xmlns="http://www.w3.org/2000/svg" width="800" height="328" viewBox="0 0 800 328" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">Drops rated above the breakdown before them</title>
<desc id="chart-desc">Dot plot of the share of drops rated above the breakdown before them, by folder of one DJ library of house tracks, for version 3 and version 4. Version 4 is higher in every folder: afro house 59% to 68%, deep house 47% to 66%, melodic house 53% to 63%, tech house 41% to 52%, and 52% to 62% over all 133 pairs.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.series-line { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-wash { fill: #2a78d6; fill-opacity: 0.10; }
.muted-fill { fill: #898781; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .series-line { stroke: #3987e5; }
  .series-fill, .series-wash { fill: #3987e5; }
  .muted-fill { fill: #898781; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="327" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">Drops rated above the breakdown before them</text>
<text x="24" y="58" class="subtitle" text-anchor="start">Share of drop and breakdown pairs in one DJ library of house tracks.</text>
<text x="24" y="80" class="subtitle" text-anchor="start">Grey: version 3. Blue: version 4, with twice the weight of loudness.</text>
<line x1="230" y1="104" x2="230" y2="264" class="axis"/>
<text x="230" y="284" class="tick" text-anchor="middle">0%</text>
<line x1="357.5" y1="104" x2="357.5" y2="264" class="grid"/>
<text x="357.5" y="284" class="tick" text-anchor="middle">25%</text>
<line x1="485" y1="104" x2="485" y2="264" class="grid"/>
<text x="485" y="284" class="tick" text-anchor="middle">50%</text>
<line x1="612.5" y1="104" x2="612.5" y2="264" class="grid"/>
<text x="612.5" y="284" class="tick" text-anchor="middle">75%</text>
<line x1="740" y1="104" x2="740" y2="264" class="grid"/>
<text x="740" y="284" class="tick" text-anchor="middle">100%</text>
<text x="485" y="308" class="label" text-anchor="middle">Drops rated above their breakdown</text>
<text x="216" y="124.5" class="label" text-anchor="end">Afro house (34)</text>
<line x1="530" y1="120" x2="575" y2="120" class="reference"/>
<circle cx="530" cy="120" r="5" class="muted-fill ring"/>
<circle cx="575" cy="120" r="5" class="series-fill ring"/>
<text x="216" y="156.5" class="label" text-anchor="end">Deep house (32)</text>
<line x1="469.06" y1="152" x2="564.69" y2="152" class="reference"/>
<circle cx="469.06" cy="152" r="5" class="muted-fill ring"/>
<circle cx="564.69" cy="152" r="5" class="series-fill ring"/>
<text x="216" y="188.5" class="label" text-anchor="end">Melodic house (32)</text>
<line x1="500.94" y1="184" x2="548.75" y2="184" class="reference"/>
<circle cx="500.94" cy="184" r="5" class="muted-fill ring"/>
<circle cx="548.75" cy="184" r="5" class="series-fill ring"/>
<text x="216" y="220.5" class="label" text-anchor="end">Tech house (27)</text>
<line x1="437.78" y1="216" x2="494.44" y2="216" class="reference"/>
<circle cx="437.78" cy="216" r="5" class="muted-fill ring"/>
<circle cx="494.44" cy="216" r="5" class="series-fill ring"/>
<text x="216" y="252.5" class="label" text-anchor="end">All folders (133)</text>
<line x1="494.59" y1="248" x2="548.27" y2="248" class="reference"/>
<circle cx="494.59" cy="248" r="5" class="muted-fill ring"/>
<circle cx="548.27" cy="248" r="5" class="series-fill ring"/>
</svg>
