<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">From a measurement to a rating</title>
<desc id="chart-desc">Left: onset rate scores 0 at or below 2.5 percussive events per second, rises in a straight line, and scores 1 at or above 7 per second. Right: the weighted average of the feature scores maps to the rating as a staircase. An average of 0.2 or less gives 1, 0.8 or more gives 10, and the stretch between is cut into ten equal steps.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.value { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
.tick { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.reference { stroke: #898781; stroke-width: 1.5; fill: none; }
.series-line { stroke: #2a78d6; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.series-fill { fill: #2a78d6; }
.series-wash { fill: #2a78d6; fill-opacity: 0.10; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .value { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; }
  .axis { stroke: #383835; }
  .series-line { stroke: #3987e5; }
  .series-fill, .series-wash { fill: #3987e5; }
  .ring { stroke: #1a1a19; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="359" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">From a measurement to a rating</text>
<text x="24" y="58" class="subtitle" text-anchor="start">Each feature becomes a score, and the weighted average of the scores becomes the rating.</text>
<text x="64" y="86" class="label" text-anchor="start">Onset rate to score</text>
<line x1="64" y1="300" x2="340" y2="300" class="axis"/>
<text x="54" y="304" class="tick" text-anchor="end">0</text>
<line x1="64" y1="200" x2="340" y2="200" class="grid"/>
<text x="54" y="204" class="tick" text-anchor="end">0.5</text>
<line x1="64" y1="100" x2="340" y2="100" class="grid"/>
<text x="54" y="104" class="tick" text-anchor="end">1</text>
<text x="64" y="320" class="tick" text-anchor="middle">0</text>
<text x="133" y="320" class="tick" text-anchor="middle">2.5</text>
<text x="202" y="320" class="tick" text-anchor="middle">5</text>
<text x="257.2" y="320" class="tick" text-anchor="middle">7</text>
<text x="340" y="320" class="tick" text-anchor="middle">10</text>
<text x="202" y="342" class="label" text-anchor="middle">Percussive events per second</text>
<polyline points="64,300 133,300 257.2,100 340,100" class="series-line"/>
<circle cx="133" cy="300" r="5" class="series-fill ring"/>
<circle cx="257.2" cy="100" r="5" class="series-fill ring"/>
<text x="157" y="290" class="label" text-anchor="start">2.5 per second scores 0</text>
<text x="265.2" y="122" class="label" text-anchor="start">7 per second scores 1</text>
<text x="490" y="86" class="label" text-anchor="start">Weighted average to rating</text>
<line x1="490" y1="290" x2="766" y2="290" class="grid"/>
<text x="480" y="294" class="tick" text-anchor="end">1</text>
<line x1="490" y1="210" x2="766" y2="210" class="grid"/>
<text x="480" y="214" class="tick" text-anchor="end">5</text>
<line x1="490" y1="110" x2="766" y2="110" class="grid"/>
<text x="480" y="114" class="tick" text-anchor="end">10</text>
<line x1="490" y1="300" x2="766" y2="300" class="axis"/>
<text x="490" y="320" class="tick" text-anchor="middle">0</text>
<text x="545.2" y="320" class="tick" text-anchor="middle">0.2</text>
<text x="628" y="320" class="tick" text-anchor="middle">0.5</text>
<text x="710.8" y="320" class="tick" text-anchor="middle">0.8</text>
<text x="766" y="320" class="tick" text-anchor="middle">1</text>
<text x="628" y="342" class="label" text-anchor="middle">Weighted average of the scores</text>
<line x1="545.2" y1="100" x2="545.2" y2="300" class="reference"/>
<line x1="710.8" y1="100" x2="710.8" y2="300" class="reference"/>
<polyline points="490,290 561.76,290 561.76,270 578.32,270 578.32,250 594.88,250 594.88,230 611.44,230 611.44,210 628,210 628,190 644.56,190 644.56,170 661.12,170 661.12,150 677.68,150 677.68,130 694.24,130 694.24,110 766,110" class="series-line"/>
<text x="553.2" y="118" class="label" text-anchor="start">0.2 is the bottom</text>
<text x="702.8" y="282" class="label" text-anchor="end">0.8 is the top</text>
</svg>
