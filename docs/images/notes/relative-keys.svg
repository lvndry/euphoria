<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-labelledby="chart-title chart-desc" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="chart-title">A minor and C major light the same notes</title>
<desc id="chart-desc">Two copies of the same note strip of a made up track whose loudest notes are A, E and C. The first lights the notes of A minor, the second those of C major: the same seven notes, A B C D E F G. Only the tonic differs, A or C. Here A is the tallest bar, which points to A minor.</desc>
<style>
.surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
.title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
.subtitle { fill: #52514e; font-size: 13px; }
.label { fill: #52514e; font-size: 13px; }
.note { fill: #898781; font-size: 12px; }
.note-lit { fill: #0b0b0b; font-size: 12px; font-weight: 600; }
.lit { fill: #2a78d6; }
.unlit { fill: #d9d8d2; }
.tonic { fill: none; stroke: #0b0b0b; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
  .title, .note-lit { fill: #f0efec; }
  .subtitle, .label { fill: #c3c2b7; }
  .note { fill: #898781; }
  .lit { fill: #8fbcf2; }
  .unlit { fill: #383835; }
  .tonic { stroke: #f0efec; }
}
</style>
<rect x="0.5" y="0.5" width="799" height="229" rx="12" class="surface"/>
<text x="24" y="36" class="title" text-anchor="start">A minor and C major light the same notes</text>
<text x="24" y="58" class="subtitle" text-anchor="start">One track, two readings. The lit bars are the notes of the key; the outlined bar is its tonic.</text>
<text x="24" y="96" class="label" text-anchor="start">A minor (8A)</text>
