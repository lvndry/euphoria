<text x="34" y="212" class="note-lit" text-anchor="middle">C</text>
<rect x="52" y="174.4" width="20" height="17.6" rx="4" class="unlit"/>
<text x="62" y="212" class="note" text-anchor="middle">C#</text>
<rect x="80" y="148" width="20" height="44" rx="4" class="lit"/>
<text x="90" y="212" class="note-lit" text-anchor="middle">D</text>
<rect x="108" y="176" width="20" height="16" rx="4" class="unlit"/>
