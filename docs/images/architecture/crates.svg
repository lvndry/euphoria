<text x="40" y="352" class="module" text-anchor="start">track_name</text>
<text x="280" y="270" class="group" text-anchor="start">Analyze</text>
<text x="280" y="292" class="module" text-anchor="start">analysis</text>
<text x="280" y="312" class="module" text-anchor="start">detect</text>
<text x="280" y="332" class="module" text-anchor="start">key</text>
<text x="280" y="352" class="module" text-anchor="start">confidence</text>
<text x="280" y="372" class="module" text-anchor="start">tempo_range</text>
<text x="280" y="392" class="module" text-anchor="start">energy</text>
<text x="280" y="412" class="module" text-anchor="start">quality</text>
<text x="520" y="270" class="group" text-anchor="start">Keep and share</text>
<text x="520" y="292" class="module" text-anchor="start">cache</text>
<text x="520" y="312" class="module" text-anchor="start">correction</text>
<text x="520" y="332" class="module" text-anchor="start">playlists</text>
<text x="520" y="352" class="module" text-anchor="start">harmony</text>
<text x="520" y="372" class="module" text-anchor="start">tags</text>
<text x="520" y="392" class="module" text-anchor="start">export</text>
<rect x="24" y="470" width="752" height="152" rx="8" class="box"/>
<text x="40" y="492" class="label" text-anchor="start">The main libraries euphoria-core builds on</text>
<line x1="400" y1="430" x2="400" y2="461" class="arrow"/>
<path d="M395,461 L405,461 L400,468 Z" class="arrow-head"/>
<rect x="36" y="498" width="237.33" height="52" rx="8" class="box box-optional"/>
<text x="48" y="520" class="group" text-anchor="start">libkeyfinder</text>
<text x="48" y="538" class="small" text-anchor="start">key, C++, optional</text>
<rect x="281.33" y="498" width="237.33" height="52" rx="8" class="box"/>
<text x="293.33" y="520" class="group" text-anchor="start">stratum-dsp</text>
<text x="293.33" y="538" class="small" text-anchor="start">tempo</text>
<rect x="526.67" y="498" width="237.33" height="52" rx="8" class="box"/>
<text x="538.67" y="520" class="group" text-anchor="start">Symphonia</text>
<text x="538.67" y="538" class="small" text-anchor="start">decoding</text>
<rect x="36" y="558" width="237.33" height="52" rx="8" class="box"/>
<text x="48" y="580" class="group" text-anchor="start">blake3</text>
<text x="48" y="598" class="small" text-anchor="start">content hashes for the cache</text>
<rect x="281.33" y="558" width="237.33" height="52" rx="8" class="box"/>
<text x="293.33" y="580" class="group" text-anchor="start">rusqlite</text>
<text x="293.33" y="598" class="small" text-anchor="start">the cache, SQLite</text>
<rect x="526.67" y="558" width="237.33" height="52" rx="8" class="box"/>
<text x="538.67" y="580" class="group" text-anchor="start">ebur128, rustfft</text>
<text x="538.67" y="598" class="small" text-anchor="start">loudness, spectra</text>
</svg>
