<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Euphoria social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F6F5F1; color: #161616; font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; display: grid; grid-template-columns: 600px 1fr; gap: 24px; }
  .text { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  .brand svg { width: 38px; height: 38px; }
  h1 { margin: 0; font-weight: 600; font-stretch: 85%; font-size: 104px; line-height: 0.9; letter-spacing: -0.05em; }
  .line { margin: 22px 0 0; font-size: 30px; line-height: 1.3; color: #46474B; max-width: 26ch; }
  .foot { display: flex; gap: 22px; font-size: 22px; color: #64656A; }
  .foot b { color: #161616; font-weight: 600; }
  .art { position: relative; }
  .art svg.big { position: absolute; right: -10px; top: 20px; width: 470px; height: 470px; }
  .shot { position: absolute; left: 10px; top: 36px; width: 760px; border-radius: 16px; background: #EDECE7; padding: 14px; }
  .shot img { display: block; width: 100%; border-radius: 8px; }
  .grid { position: absolute; right: 0; top: 40px; display: grid; grid-template-columns: repeat(3, 150px); gap: 20px 18px; }
  .grid div { display: grid; gap: 6px; justify-items: start; font-size: 17px; color: #46474B; }
  .grid div b { color: #161616; font-weight: 600; font-size: 19px; }
  .grid svg { width: 116px; height: 116px; }
  .mark-path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="mark-path" data-ratio="3:2" stroke-width="4.2"></path></svg>Euphoria</div>
    <div>
      <h1 id="title"></h1>
      <p class="line" id="line"></p>
    </div>
    <div class="foot"><b>lvndry.github.io/euphoria</b><span>Free · Open source · Offline</span></div>
  </div>
  <div class="art" id="art"></div>
</div>
<script>
  const CARDS = {
    home: {
      title: "Every track,<br>in key.",
      line: "Key, tempo and energy for your whole collection, on macOS and Linux.",
      art: '<svg class="big" viewBox="0 0 64 64"><path class="mark-path" data-ratio="3:2" stroke-width="1.6"></path></svg>',
    },
    features: {
      title: "Everything<br>Euphoria does.",
      line: "Library, decks, set builder, Live, stems, tags and exports to your DJ software.",
      art: '<div class="shot"><img src="../../docs/images/desktop-app/main-window-paper.png" alt=""></div>',
    },
    mixing: {
      title: "Mix<br>in key.",
      line: "Every Camelot move drawn as the curve its two notes trace, and our own key model.",
      art: '<div class="grid">' + [["1:1", "Same key", 240], ["3:2", "Fifth", 270], ["4:3", "Fourth", 210], ["6:5", "Relative", 240], ["9:8", "Energy boost", 300], ["45:32", "Clash", 60]]
        .map(([ratio, name, hue]) => `<div><svg viewBox="0 0 64 64"><path class="mark-path" data-ratio="${ratio}" stroke-width="${(2.6 * Math.min(1, Math.sqrt(7 / ratio.split(":").map(Number).reduce((sum, part) => sum + part)))).toFixed(2)}" style="color:oklch(0.58 0.15 ${hue})"></path></svg><b>${name}</b><span>${ratio.replace(":", " : ")}</span></div>`).join("") + "</div>",
    },
  };
  const card = CARDS[new URLSearchParams(location.search).get("page")] || CARDS.home;
  document.getElementById("title").innerHTML = card.title;
  document.getElementById("line").textContent = card.line;
  document.getElementById("art").innerHTML = card.art;

  const point = (larger, smaller, turn) => [32 + 24 * Math.sin(larger * 2 * Math.PI * turn), 32 + 24 * Math.cos(smaller * 2 * Math.PI * turn)];
  function spanFor(larger, smaller) {
    for (let step = 0; step <= 200; step++) {
      const turn = 0.25 + 0.5 * step / 200;
      const [ax, ay] = point(larger, smaller, turn);
      const [bx, by] = point(larger, smaller, 1.5 - turn);
      if (Math.abs(ax - bx) > 1e-3 || Math.abs(ay - by) > 1e-3) return [0.25, 1.25];
    }
    return [0.25, 0.75];
  }
  document.querySelectorAll("path[data-ratio]").forEach((path) => {
    const [larger, smaller] = path.dataset.ratio.split(":").map(Number);
    const [start, end] = spanFor(larger, smaller);
    const count = Math.ceil(Math.max(300, (larger + smaller) * 70) * (end - start) / 0.5);
    let d = "";
    for (let index = 0; index < count; index++) {
      const [across, down] = point(larger, smaller, start + (end - start) * index / (count - 1));
      d += (index ? "L" : "M") + across.toFixed(2) + " " + down.toFixed(2);
    }
    path.setAttribute("d", d);
  });
</script>
</body>
</html>
