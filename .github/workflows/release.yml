name: Release

# Builds and publishes a release of Euphoria for macOS and Linux. Started by hand from the
# Actions tab: choose "Run workflow" on main. There is nothing to fill in:
# the version is the next calendar version, YEAR.MONTH.N, worked out from
# the date and the existing tags (docs/development/releasing.md).
#
# The release commit, which sets the version in the Cargo manifests, is not
# pushed to main. It sits on top of main's commit and only the tag v<version>
# points at it, so main's ruleset, which requires a pull request, applies
# unchanged.
#
# A run that failed after pushing the tag is finished by running the workflow
# again: when the newest tag has no release, or one without all its files,
# the run checks that the tag points at a release commit made on a commit of
# main that passed CI, rebuilds that version from it and publishes it. The
# tag is never moved.

on:
  workflow_dispatch:
    inputs:
      allow-adhoc-fallback:
        description: Build with the ad hoc signature and publish, instead of failing, when signing or notarization fails. For a new version the ad hoc fallback is allowed automatically, because no release exists for that version yet; for a version a release already carries, this input is what allows it.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and choose the version
    # Only the owner can release, and only from main.
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      base: ${{ steps.base.outputs.base }}
      linux: ${{ steps.linux.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose a new version or the one to finish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/release/plan_release.py | tee -a "$GITHUB_OUTPUT"
      - name: Find the commit to build
        id: base
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if [ "$MODE" = new ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
              echo "::error::The tag v$VERSION exists already."
              exit 1
            fi
            echo "base=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "Releasing $VERSION from $GITHUB_SHA."
            exit 0
          fi

          # Finishing a release: the tag must point at the release commit the
          # workflow made, on top of a commit of main, holding exactly that
          # commit's files with the version set.
          tag_commit=$(git rev-parse "v$VERSION^{commit}")
          if [ "$(git log -1 --format=%s "$tag_commit")" != "chore(release): $VERSION" ]; then
            echo "::error::v$VERSION does not point at a release commit."
            exit 1
          fi
          if [ "$(git rev-list --parents -n 1 "$tag_commit" | wc -w)" -ne 2 ]; then
            echo "::error::The release commit of v$VERSION does not have exactly one parent."
            exit 1
          fi
          base=$(git rev-parse "$tag_commit^")
          if ! git merge-base --is-ancestor "$base" origin/main; then
            echo "::error::v$VERSION was not made on a commit of main."
            exit 1
          fi
          git worktree add --quiet --detach "$RUNNER_TEMP/base" "$base"
          (
            cd "$RUNNER_TEMP/base"
            python3 scripts/release/set_version.py "$VERSION" > /dev/null
            git add --all
            [ "$(git write-tree)" = "$(git rev-parse "$tag_commit^{tree}")" ]
          ) || {
            echo "::error::v$VERSION holds other changes than its version."
            exit 1
          }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Finishing $VERSION, tagged on $base."
      - name: Check whether the commit to build packages Linux
        id: linux
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          # A release tagged before the Linux packaging existed is finished
          # with the macOS files only, the files it was made with.
          if git cat-file -e "$BASE:scripts/bundle-linux.sh" 2> /dev/null; then
            echo "linux=true" >> "$GITHUB_OUTPUT"
          else
            echo "linux=false" >> "$GITHUB_OUTPUT"
            echo "$BASE has no Linux packaging; this release has macOS files only."
          fi
      - name: Check that CI passed on the commit to build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.base.outputs.base }}
        run: |
          passed=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq '.total_count')
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $SHA. Wait for it to finish, or fix main first."
            exit 1
          fi

  build:
    name: Build for macOS
    needs: prepare
    # macos-15 runs on Apple Silicon. Intel is left out: Apple sells no Intel
    # Macs any more.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.version.outputs.tree }}
      minimum_macos: ${{ steps.minimum.outputs.minimum_macos }}
      notarized: ${{ steps.packages.outputs.notarized }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MODE: ${{ needs.prepare.outputs.mode }}
      AD_HOC_FALLBACK: ${{ inputs.allow-adhoc-fallback }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - name: Set the version
        id: version
        run: |
          python3 scripts/release/set_version.py "$VERSION"
          git add --all
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the version in Cargo.lock
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Check for the Apple signing secrets
        id: signing
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          for name in APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_TEAM_ID \
            APPLE_NOTARY_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "The Apple secrets are set; signing with Developer ID and notarizing."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not signed with a Developer ID::These secrets are not set: ${missing[*]}. The app and the command line tool get an ad hoc signature and are not notarized, so macOS warns when they are opened on another Mac. See docs/development/releasing.md."
          fi
      - name: Import the Developer ID certificate and the notary key
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/euphoria-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          echo "EUPHORIA_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          identities=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" || true)
          if [ "$(printf '%s\n' "$identities" | grep -c .)" -ne 1 ]; then
            echo "::error::The certificate must hold exactly one Developer ID Application identity; found: ${identities:-none}"
            exit 1
          fi
          case "$identities" in
            *"($APPLE_TEAM_ID)"*) ;;
            *)
              echo "::error::The Developer ID Application certificate does not belong to the team in APPLE_TEAM_ID."
              exit 1
              ;;
          esac
          identity=$(printf '%s\n' "$identities" | awk '{print $2}')

          (umask 077 && printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8")
          {
            echo "EUPHORIA_SIGN_IDENTITY=$identity"
            echo "EUPHORIA_NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "EUPHORIA_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "EUPHORIA_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Build and sign the app, the disk image and the command line tool
        id: packages
        run: |
          build_packages() {
            ./scripts/bundle-macos.sh
            ./scripts/release/package-cli.sh dist
          }
          notarized=
          if [ "${SIGNING_AVAILABLE}" = true ]; then
            if (build_packages); then
              notarized=true
            else
              # A failed sign or notarization must not silently downgrade a
              # release a successful run already published. The ad hoc
              # fallback is allowed only for a version no release carries
              # yet, or when the owner opts in with the workflow's
              # "allow-adhoc-fallback" input.
              if [ "$MODE" = resume ] && [ "$AD_HOC_FALLBACK" != true ]; then
                echo "::error title=Notarized release already published::Signing or notarization failed, for instance because the Apple Developer Program membership lapsed, an agreement is unsigned or the certificate was revoked. A release already exists for $VERSION, so an ad hoc build would silently downgrade it. Fix Apple, or run the workflow again with the allow-adhoc-fallback input set."
                exit 1
              fi
              echo "::warning title=Not notarized::Signing or notarization failed, for instance because the Apple Developer Program membership lapsed, an agreement is unsigned or the certificate was revoked. This release is built with the ad hoc signature and says so in its notes."
              # Nothing signed with the Developer ID may stay in the packages.
              rm -rf target/release/bundle/Euphoria.app target/release/bundle/*.dmg dist
            fi
          fi
          if [ -n "$notarized" ]; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            unset EUPHORIA_SIGN_IDENTITY EUPHORIA_NOTARY_KEY_PATH EUPHORIA_NOTARY_KEY_ID EUPHORIA_NOTARY_ISSUER_ID
            # A real problem, such as a binary that fails codesign --verify, fails here too.
            build_packages
          fi
        env:
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
      - name: Read the oldest macOS the app runs on
        id: minimum
        run: |
          minimum=$(plutil -extract LSMinimumSystemVersion raw target/release/bundle/Euphoria.app/Contents/Info.plist)
          echo "minimum_macos=$minimum" >> "$GITHUB_OUTPUT"
          echo "The app needs macOS $minimum or later."
      - name: Verify the signatures and notarization
        if: steps.packages.outputs.notarized == 'true'
        run: |
          dmg="target/release/bundle/Euphoria-$VERSION.dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t install "$dmg"

          mount_point="$RUNNER_TEMP/dmg"
          mkdir "$mount_point"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point" > /dev/null
          trap 'hdiutil detach "$mount_point" > /dev/null || true' EXIT
          app="$mount_point/Euphoria.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv "$app"
          codesign -dvv "$app" 2>&1 | grep -q "flags=0x10000(runtime)"

          unpacked="$RUNNER_TEMP/cli"
          mkdir "$unpacked"
          tar -xzf dist/euphoria-*-aarch64-apple-darwin.tar.gz -C "$unpacked"
          for file in "$unpacked"/*/bin/euphoria "$unpacked"/*/lib/*.dylib; do
            codesign --verify --strict --verbose=2 "$file"
            codesign -dvv "$file" 2>&1 | grep -q "flags=0x10000(runtime)"
          done
          for executable in "$unpacked"/*/bin/euphoria; do
            "$executable" --version
          done
      - name: Gather the files and their checksums
        run: |
          cp "target/release/bundle/Euphoria-$VERSION.dmg" dist/
          # The same disk image under a name without the version, so that
          # releases/latest/download/Euphoria.dmg always leads to the newest.
          cp "target/release/bundle/Euphoria-$VERSION.dmg" dist/Euphoria.dmg
          # The public key of the signature the publish job writes on
          # every file, so that install.sh can verify the release from the
          # release itself. A tag made before the key existed has no file
          # of its own; the key in the repository does not change, so
          # main's copy is the one.
          if git cat-file -e "v$VERSION:release/minisign.pub" 2> /dev/null; then
            git show "v$VERSION:release/minisign.pub" > dist/minisign.pub
          else
            git show "origin/main:release/minisign.pub" > dist/minisign.pub
          fi
          cd dist
          shasum -a 256 -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Delete the keychain and the keys
        if: always()
        run: |
          if [ -n "${EUPHORIA_KEYCHAIN:-}" ]; then
            security delete-keychain "$EUPHORIA_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary-key.p8"

  build-linux:
    name: Build for Linux
    needs: prepare
    if: needs.prepare.outputs.linux == 'true'
    # Built on the oldest Ubuntu LTS the runners offer, because a Linux
    # program needs at least the glibc it was built against. The release
    # notes give that version, read from the files themselves.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.version.outputs.tree }}
      minimum_glibc: ${{ steps.minimum.outputs.minimum_glibc }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Link the ONNX Runtime install-linux-dependencies.sh puts into
      # /usr/local/lib, which runs on 22.04's libstdc++, instead of the one
      # ort downloads, which needs a newer C++ runtime.
      ORT_LIB_PATH: /usr/local/lib
      ORT_PREFER_DYNAMIC_LINK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - name: Set the version
        id: version
        run: |
          python3 scripts/release/set_version.py "$VERSION"
          git add --all
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
      - name: Install system libraries and the ONNX Runtime
        run: ./.github/scripts/install-linux-dependencies.sh
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check the version in Cargo.lock
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Build the app and the AppImage
        run: ./scripts/bundle-linux.sh
      - name: Build the command line tool
        run: ./scripts/release/package-cli.sh dist
      - name: Gather the files
        run: |
          cp "target/release/bundle/Euphoria-$VERSION-x86_64.AppImage" dist/
          # The same AppImage under a name without the version, so that
          # releases/latest/download/Euphoria-x86_64.AppImage always leads
          # to the newest.
          cp "target/release/bundle/Euphoria-$VERSION-x86_64.AppImage" dist/Euphoria-x86_64.AppImage
          # The minisign public key, so that the release carries it once,
          # from either build, for the publish job to sign with. A tag
          # made before the key existed has no file of its own; the key in
          # the repository does not change, so main's copy is the one.
          if git cat-file -e "v$VERSION:release/minisign.pub" 2> /dev/null; then
            git show "v$VERSION:release/minisign.pub" > dist/minisign.pub
          else
            git show "origin/main:release/minisign.pub" > dist/minisign.pub
          fi
      - name: Check that the files run on a clean system
        run: ./scripts/release/check-linux-packages.sh dist
      - name: Read the oldest glibc the files run on
        id: minimum
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf dist/euphoria-*-x86_64-unknown-linux-gnu.tar.gz -C "$RUNNER_TEMP/unpacked"
          minimum=$(python3 scripts/linux_libraries.py minimum-glibc \
            --root target/release/bundle/Euphoria.AppDir --root "$RUNNER_TEMP/unpacked")
          echo "minimum_glibc=$minimum" >> "$GITHUB_OUTPUT"
          echo "The Linux files need glibc $minimum or later."
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and publish
    needs: [prepare, build, build-linux]
    # The Linux build is skipped only for a release tagged before it existed.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-linux.result == 'success' || needs.prepare.outputs.linux == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MODE: ${{ needs.prepare.outputs.mode }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      BASE: ${{ needs.prepare.outputs.base }}
      BUILT_TREE: ${{ needs.build.outputs.tree }}
      LINUX: ${{ needs.prepare.outputs.linux }}
      LINUX_TREE: ${{ needs.build-linux.outputs.tree }}
      MINIMUM_MACOS: ${{ needs.build.outputs.minimum_macos }}
      NOTARIZED: ${{ needs.build.outputs.notarized }}
      MINIMUM_GLIBC: ${{ needs.build-linux.outputs.minimum_glibc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Make the release commit and tag, or check the existing tag
        run: |
          if [ "$LINUX" = true ] && [ "$LINUX_TREE" != "$BUILT_TREE" ]; then
            echo "::error::Linux and macOS were built from different files ($LINUX_TREE and $BUILT_TREE)."
            exit 1
          fi
          if [ "$MODE" = resume ]; then
            tree=$(git rev-parse "v$VERSION^{tree}")
            if [ "$tree" != "$BUILT_TREE" ]; then
              echo "::error::v$VERSION holds other files than were built ($tree, built $BUILT_TREE)."
              exit 1
            fi
            echo "v$VERSION exists and matches the build; it stays where it is."
            exit 0
          fi
          git checkout --quiet --detach "$BASE"
          python3 scripts/release/set_version.py "$VERSION"
          git add --all
          tree=$(git write-tree)
          if [ "$tree" != "$BUILT_TREE" ]; then
            echo "::error::The files to tag differ from the files that were built ($tree, built $BUILT_TREE)."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore(release): $VERSION"
          git tag --annotate "v$VERSION" --message "Euphoria $VERSION"
      - name: Write the release notes
        run: |
          since=()
          if [ -n "$PREVIOUS_TAG" ]; then
            since=(--since "$PREVIOUS_TAG")
          fi
          linux_flag=()
          if [ "$LINUX" = true ]; then
            linux_flag=(--minimum-glibc "$MINIMUM_GLIBC")
          fi
          notarized_flag=()
          if [ "$NOTARIZED" = true ]; then
            notarized_flag=(--notarized)
          fi
          python3 scripts/release/release_notes.py --version "$VERSION" "${since[@]}" "${notarized_flag[@]}" \
            --until "$BASE" --repository "$GITHUB_REPOSITORY" \
            --minimum-macos "$MINIMUM_MACOS" "${linux_flag[@]}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.LINUX == 'true'
        with:
          name: release-files-linux
          path: dist-linux
      - name: Check the files against their checksums
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          if [ "$LINUX" = true ]; then
            (cd dist-linux && sha256sum --check SHA256SUMS)
            # One SHA256SUMS lists the files of every system.
            cat dist-linux/SHA256SUMS >> dist/SHA256SUMS
            rm dist-linux/SHA256SUMS
            for file in dist-linux/*; do
              if [ -e "dist/$(basename "$file")" ]; then
                echo "::error::$(basename "$file") was built for both macOS and Linux."
                exit 1
              fi
              mv "$file" dist/
            done
            (cd dist && sha256sum --check SHA256SUMS)
          fi
      - name: Add the install script
        run: |
          # The script from the release's own commit, so that
          # releases/latest/download/install.sh is the one that passed CI
          # with this release. Releases tagged before it existed go without.
          if git cat-file -e "v$VERSION:scripts/install.sh" 2> /dev/null; then
            git show "v$VERSION:scripts/install.sh" > dist/install.sh
            (cd dist && sha256sum install.sh >> SHA256SUMS && sha256sum --check SHA256SUMS)
          else
            echo "v$VERSION has no scripts/install.sh; publishing without it."
          fi
      - name: Sign the files with minisign
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_PRIVKEY_KEY: ${{ secrets.MINISIGN_PRIVKEY_KEY }}
        run: |
          # The key signs the files of every system at once, because this
          # is the job where they are joined. A release made before the
          # secret was set carries its files without their signatures;
          # install.sh checks those with checksums only. Once the secret
          # is set, every release and every run that finishes an existing
          # release is signed. The minisign binary itself goes out as an
          # asset, because install.sh verifies the signatures with it,
          # without needing minisign installed; its checksum is in
          # SHA256SUMS, so it is checked like every other file.
          # Pinned and checksummed like every other downloaded tool. The
          # binary is a statically linked musl build.
          tarball="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$tarball" \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          minisign="$RUNNER_TEMP/minisign-linux/x86_64/minisign"
          cp "$minisign" dist/minisign-0.12-linux-x86_64
          chmod 755 dist/minisign-0.12-linux-x86_64
          (umask 077 && printf '%s\n' "$MINISIGN_PRIVKEY_KEY" > "$RUNNER_TEMP/minisign.key")
          if [ -z "$MINISIGN_PRIVKEY_KEY" ]; then
            if gh release view "v$VERSION" > /dev/null 2>&1; then
              echo "::error::MINISIGN_PRIVKEY_KEY is not set, but a release exists for v$VERSION, so its files cannot be minisigned. Set the secret and run the workflow again to finish the release with its signatures."
              exit 1
            fi
            echo "::warning title=Release files are not minisigned::MINISIGN_PRIVKEY_KEY is not set and no release exists for v$VERSION yet, so its files go out without minisign signatures. Set the secret and run the workflow again to finish the release with its signatures; every later release is signed."
            exit 0
          fi
          cd dist
          # The binary was copied after the checksums were written, so its
          # line goes in before the files are signed, and the check below
          # covers it like every other file.
          sha256sum minisign-0.12-linux-x86_64 >> SHA256SUMS
          # minisign asks for the key's password on its standard input.
          for file in *; do
            [ -f "$file" ] || continue
            case "$file" in
              *.minisig) continue ;;
            esac
            echo github-actions | "$minisign" -S -m "$file" -s "$RUNNER_TEMP/minisign.key"
          done
          sha256sum --check SHA256SUMS
          # The files are right, the signatures hold: this run's own key
          # verified this run's own signatures with the release's key.
          "$minisign" -V -p minisign.pub -x minisign-0.12-linux-x86_64.minisig -m minisign-0.12-linux-x86_64
          cat SHA256SUMS

      - name: Push the tag
        if: env.MODE == 'new'
        run: git push origin "refs/tags/v$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a confirmed "not found" means the release must be created;
          # any other failure stops the run with its own message.
          if view_error="$(gh release view "v$VERSION" 2>&1 >/dev/null)"; then
            release_exists=true
          elif grep -qi "release not found" <<<"$view_error"; then
            release_exists=false
          else
            echo "$view_error" >&2
            exit 1
          fi
          if [ "$release_exists" = true ]; then
            # An earlier run made the release but did not finish it. The
            # notes are written last, so their closing marker shows the
            # release is complete.
            gh release upload "v$VERSION" dist/* --clobber
            gh release edit "v$VERSION" \
              --latest \
              --title "Euphoria $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "v$VERSION" dist/* \
              --verify-tag \
              --latest \
              --title "Euphoria $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  homebrew:
    name: Publish to Homebrew
    needs: [prepare, publish]
    if: needs.publish.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      JAZZ_GITHUB_APP_ID: ${{ secrets.JAZZ_GITHUB_APP_ID }}
      JAZZ_GITHUB_APP_PRIVATE_KEY: ${{ secrets.JAZZ_GITHUB_APP_PRIVATE_KEY }}

  check-homebrew:
    # The release is published when this job finishes, so a failed tap
    # publish must fail the run, and it must not be skipped quietly: a
    # reusable workflow's own failure does not fail the run that calls it,
    # only the job that runs it.
    name: Check that the tap is published
    needs: [prepare, publish, homebrew]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          if [ "${{ needs.homebrew.result }}" != success ]; then
            echo "::error::The release v${{ needs.prepare.outputs.version }} is published, but the Homebrew tap could not be pushed (the homebrew job ${{ needs.homebrew.result }}). Run the "Publish to Homebrew" workflow by hand with that version; a later release overwrites the tap too."
            exit 1
          fi
          echo "The tap is up to date with v${{ needs.prepare.outputs.version }}."
