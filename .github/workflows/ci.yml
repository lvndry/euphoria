name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  # Debug info bloats the cache without helping CI.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          base="$BASE_SHA"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          elif [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          git diff --name-only --no-renames -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-files"

          rust=false
          while IFS= read -r -d '' path; do
            case "$path" in
              crates/*|assets/*|bench/*.sh|bench/*.py|scripts/*|*.rs|*.toml|Cargo.lock|.cargo/*|rust-toolchain*|.github/scripts/*|.github/workflows/ci.yml|.editorconfig)
                rust=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/ci-changed-files"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  format:
    name: Formatting
    needs: changes
    # If change detection fails, run the checks rather than silently skipping them.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check TOML formatting
        run: taplo fmt --check --diff

  dependencies:
    name: Dependency advisories and licenses
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system libraries on macOS
        if: runner.os == 'macOS'
        run: brew install libkeyfinder
      - name: Install system libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libfftw3-dev pkg-config
          ./.github/scripts/install-libkeyfinder.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy without libkeyfinder
        run: cargo clippy -p euphoria-core --no-default-features --all-targets --locked -- -D warnings

  test:
    name: Tests on ${{ matrix.system.name }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - { name: macOS, runner: macos-latest, packages: --workspace }
          # The desktop app needs the X11, Wayland and font development packages
          # that GPUI links against on Linux. Until those are installed and the
          # app is checked there, the Linux job tests every other crate.
          - { name: Linux, runner: ubuntu-latest, packages: --workspace --exclude euphoria-app }
    runs-on: ${{ matrix.system.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system libraries on macOS
        if: runner.os == 'macOS'
        run: brew install libkeyfinder
      - name: Install system libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libfftw3-dev pkg-config
          ./.github/scripts/install-libkeyfinder.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test ${{ matrix.system.packages }} --lib --bins --locked
      - name: Audio decoding and detector integration tests
        run: cargo test ${{ matrix.system.packages }} --test '*' --locked
      - name: Core tests without libkeyfinder
        run: cargo test -p euphoria-core --no-default-features --locked
