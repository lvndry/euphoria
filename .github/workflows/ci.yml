name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  # Debug info bloats the cache without helping CI.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      packaging: ${{ steps.paths.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BASE_SHA"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          elif [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          git diff --name-only --no-renames -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-files"

          rust=false
          packaging=false
          while IFS= read -r -d '' path; do
            case "$path" in
              apps/*|crates/*|assets/*|bench/*.sh|bench/*.py|scripts/*|*.rs|*.toml|Cargo.lock|.cargo/*|rust-toolchain*|.github/scripts/*|.github/actions/*|.github/workflows/ci.yml|.github/workflows/release.yml|.editorconfig)
                rust=true
                ;;
            esac
            case "$path" in
              Cargo.lock|*Cargo.toml|*/build.rs|*.cpp|assets/logo/*|scripts/linux_libraries.py|scripts/bundle-linux.sh|scripts/release/package-cli.sh|scripts/release/check-linux-packages.sh|.github/scripts/*|.github/actions/*|.github/workflows/ci.yml|.github/workflows/release.yml)
                packaging=true
                ;;
            esac
          done < "$RUNNER_TEMP/ci-changed-files"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  format:
    name: Formatting
    needs: changes
    # If change detection fails, run the checks rather than silently skipping them.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check TOML formatting
        run: taplo fmt --check --diff
      - name: Check release and CI helper scripts
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  dependencies:
    name: Dependency advisories and licenses
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
      # cargo deny cannot see vendored C++, so its files are checked against
      # the tags and checksums recorded when it was vendored.
      - name: Vendored Signalsmith libraries match VENDORED.md
        run: python3 scripts/vendor_signalsmith.py check

  python:
    name: Release and benchmark script tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Vendored library updater regressions
        run: uv run --no-project --python 3.12 python -m unittest scripts/test_vendor_signalsmith.py
      - name: Release scripts
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Benchmark scripts
        run: uv run --no-project --python 3.12 --with numpy --with scipy python -m unittest discover -s bench -p 'test_*.py'

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Relative links and headings
        run: uv run --no-project --python 3.12 python -m unittest scripts/test_docs_links.py

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system libraries on macOS
        if: runner.os == 'macOS'
        run: brew install libkeyfinder
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy without libkeyfinder
        run: cargo clippy -p euphoria-core --no-default-features --all-targets --locked -- -D warnings

  test-macos:
    name: ${{ matrix.suite.name }} on macOS
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Core unit tests
            key: core-unit
            # The desktop app enables the stems feature, which the workspace
            # build unifies into the core, and its tests only compile then.
            command: cargo test -p euphoria-core --features stems --lib --bins --locked
          - name: Desktop unit and headless UI tests
            key: desktop-unit
            command: cargo test -p euphoria-desktop --bins --locked
          - name: Command line unit, integration and packaging tests
            key: cli
            # The debug build of the euphoria command, made by the tests,
            # links libkeyfinder and FFTW like the app does, so the app needs
            # no release build here.
            command: |
              cargo test -p euphoria-cli -p euphoria-bench --bins --locked
              cargo test -p euphoria-cli --test '*' --locked
              test -x "$EUPHORIA_LINKED_BINARY"
              uv run --no-project --python 3.12 python -m unittest scripts/test_macos_libraries.py
          - name: Core integration tests
            key: core-integration
            command: cargo test -p euphoria-core --test '*' --locked
          - name: Core tests without libkeyfinder
            key: core-without-libkeyfinder
            command: cargo test -p euphoria-core --no-default-features --locked
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      EUPHORIA_LINKED_BINARY: ${{ github.workspace }}/target/debug/euphoria
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system libraries
        run: brew install libkeyfinder
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.suite.key }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.suite.key == 'cli'
      - name: ${{ matrix.suite.name }}
        run: ${{ matrix.suite.command }}

  test-linux:
    name: Tests on Linux
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    # These debug binaries are also packaged and exercised on 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Link the ONNX Runtime install-linux-dependencies.sh puts into
      # /usr/local/lib, which runs on 22.04's libstdc++, instead of the one
      # ort downloads, which needs a newer C++ runtime.
      ORT_LIB_PATH: /usr/local/lib
      ORT_PREFER_DYNAMIC_LINK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-dependencies
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not restore native objects built against a newer Ubuntu ABI.
          key: ubuntu-22.04
      # The desktop app is built, linted and tested by its own job below,
      # so these test every other crate.
      - name: Unit tests
        run: cargo test --workspace --exclude euphoria-desktop --lib --bins --locked
      - name: Audio decoding and detector integration tests
        run: cargo test --workspace --exclude euphoria-desktop --test '*' --locked
      - name: Core tests without libkeyfinder
        run: cargo test -p euphoria-core --no-default-features --locked
      - name: Linux packaging library tests
        # The debug build of the euphoria command links libkeyfinder and FFTW
        # from /usr/local/lib, so bundling it exercises the same walk as the
        # release.
        env:
          EUPHORIA_LINKED_BINARY: ${{ github.workspace }}/target/debug/euphoria
        run: |
          test -x "$EUPHORIA_LINKED_BINARY"
          python3 -m unittest scripts/test_linux_libraries.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The clean-system smoke test packs this binary without rebuilding it.
        with:
          name: linux-debug-cli
          path: target/debug/euphoria
          if-no-files-found: error
          retention-days: 1

  test-macos-result:
    name: Tests on macOS
    needs: test-macos
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every macOS test job passed or was skipped
        env:
          RESULT: ${{ needs.test-macos.result }}
        run: '[[ "$RESULT" == success || "$RESULT" == skipped ]]'

  desktop-linux:
    name: Desktop app on Linux
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    # Match the oldest clean runtime used by the debug-package smoke test.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # Link the ONNX Runtime install-linux-dependencies.sh puts into
      # /usr/local/lib, which runs on 22.04's libstdc++, instead of the one
      # ort downloads, which needs a newer C++ runtime.
      ORT_LIB_PATH: /usr/local/lib
      ORT_PREFER_DYNAMIC_LINK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-dependencies
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-desktop
      - name: Build with the X11 and Wayland back ends
        run: cargo build -p euphoria-desktop --locked
      - name: Clippy
        # The code behind cfg(not(target_os = "macos")) is linted only here.
        run: cargo clippy -p euphoria-desktop --all-targets --locked -- -D warnings
      - name: Unit and headless UI tests
        run: cargo test -p euphoria-desktop --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The clean-system smoke test packs this binary without rebuilding it.
        with:
          name: linux-debug-desktop
          path: target/debug/euphoria-desktop
          if-no-files-found: error
          retention-days: 1

  linux-packages:
    name: Linux AppImage and tarball on a clean system
    needs: [changes, test-linux, desktop-linux]
    # The LTO release build takes a while, so on a pull request this runs
    # only when what goes into the packages changes: dependencies, build
    # scripts and packaging scripts. On pushes to main and manual runs it
    # always runs, and a Rust source-only change packages the binaries the
    # other Linux jobs built instead of rebuilding, then runs the same
    # clean-system check, so a change that breaks startup or runtime
    # dependencies still fails before the release workflow rebuilds.
    # A skipped job counts as passed for required checks.
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.packaging == 'true'
      || (github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # Link the ONNX Runtime install-linux-dependencies.sh puts into
      # /usr/local/lib, which runs on 22.04's libstdc++, instead of the one
      # ort downloads, which needs a newer C++ runtime.
      ORT_LIB_PATH: /usr/local/lib
      ORT_PREFER_DYNAMIC_LINK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-dependencies
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app and the AppImage
        if: needs.changes.outputs.packaging == 'true'
        run: ./scripts/bundle-linux.sh
      - name: Build the command line tool
        if: needs.changes.outputs.packaging == 'true'
        run: ./scripts/release/package-cli.sh dist
      - name: Check that the files run on a clean system
        if: needs.changes.outputs.packaging == 'true'
        run: |
          cp target/release/bundle/Euphoria-*-x86_64.AppImage dist/
          ./scripts/release/check-linux-packages.sh dist
      - name: Read the oldest glibc the files run on
        if: needs.changes.outputs.packaging == 'true'
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf dist/euphoria-*-x86_64-unknown-linux-gnu.tar.gz -C "$RUNNER_TEMP/unpacked"
          python3 scripts/linux_libraries.py minimum-glibc \
            --root target/release/bundle/Euphoria.AppDir --root "$RUNNER_TEMP/unpacked"

      # The smoke test: no LTO rebuild, the debug binaries the other Linux
      # jobs made are packaged the release way, and the packages are still
      # proven to run on a clean system.
      - name: Download the debug command line binary
        if: needs.changes.outputs.packaging != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-debug-cli
          path: target/debug
      - name: Download the debug desktop binary
        if: needs.changes.outputs.packaging != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-debug-desktop
          path: target/debug
      - name: Package the debug binaries the release way
        if: needs.changes.outputs.packaging != 'true'
        run: |
          mkdir -p target/release
          cp target/debug/euphoria target/release/euphoria
          cp target/debug/euphoria-desktop target/release/euphoria-desktop
          # Artifact downloads restore regular files as 0644.
          chmod +x target/release/euphoria target/release/euphoria-desktop
          ./scripts/release/package-cli.sh --skip-build dist
          ./scripts/bundle-linux.sh --skip-build
      - name: Smoke test the packages on a clean system
        if: needs.changes.outputs.packaging != 'true'
        run: |
          cp target/release/bundle/Euphoria-*-x86_64.AppImage dist/
          ./scripts/release/check-linux-packages.sh dist
