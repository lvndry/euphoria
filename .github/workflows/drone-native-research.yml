name: Native cached-feature research

on:
  pull_request:
    paths:
      - research/drone-native-cached/**
      - .github/workflows/drone-native-research.yml
  push:
    branches: [main]
    paths:
      - research/drone-native-cached/**
      - .github/workflows/drone-native-research.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_BUILD_JOBS: 2

jobs:
  contracts:
    name: Standalone contracts on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/drone-native-cached
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: research/drone-native-cached -> target
      - name: Formatting
        run: cargo fmt --check
      - name: Contract tests without model/runtime downloads
        # The explicit pinned-runtime integration test remains manual: its160
        # synthetic cases were executed on the research host, not by this job.
        run: cargo test --locked
      - name: Clippy
        # Match the production workflow's macOS lint platform. Both supported
        # native platforms run the contract tests above.
        if: runner.os == 'macOS'
        run: cargo clippy --all-targets --locked -- -D warnings
