name: Bug report
description: Something crashes, fails or behaves unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Include any error message in full.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `euphoria analyze ~/Music/Folder`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Euphoria version
      placeholder: Output of `euphoria --version`, or the commit you built
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: macOS 26.2 on Apple silicon
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Audio format involved, if any
      placeholder: FLAC, 44.1 kHz, stereo
